">\n          <span aria-hidden=\"true\" style=\"font-size:16px;line-height:1.4;color:#6FA030\">⊕<\u002Fspan>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#6FA030;font-weight:500\">Los textos con <strong>línea punteada<\u002Fstrong> y los enlaces <strong>“Más detalle sobre este punto”<\u002Fstrong> se abren con un clic para ver la evidencia. Vuelve a hacer clic para cerrarlos. Los gráficos y cifras del caso están en la pestaña <strong>Resumen<\u002Fstrong>.<\u002Fp>\n        <\u002Fdiv>\n\n        <h2 id=\"res-aprendizajes\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:0 0 20px;scroll-margin-top:100px\">Impacto en aprendizajes<\u002Fh2>\n        <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La SEP mejora los resultados en las pruebas estandarizadas nacionales, y lo hace <strong>fundamentalmente en los establecimientos que atienden a la población de menor nivel socioeconómico<\u002Fstrong>, con lo que contribuye a reducir la brecha socioeconómica de resultados (Mizala &amp; Torche, 2013).<\u002Fp>\n        <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">Evaluaciones posteriores identifican mejoras significativas en lenguaje y matemáticas, con un progreso más marcado entre los estudiantes más vulnerables. En PISA la mejora es importante, pero <button sc-camel-on-click=\"{{ deep.r1.toggle }}\" aria-expanded=\"{{ deep.r1.open }}\" style=\"border:none;background:none;padding:0;font:inherit;border-bottom:1.5px dotted #0D4A57;cursor:pointer;font-weight:600;color:#0D4A57\">persisten diferencias socioeconómicas relevantes<span aria-hidden=\"true\" style=\"font-size:11px;margin-left:3px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton>.<\u002Fp>\n        <sc-if value=\"{{ deep.r1.open }}\">\n          <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:4px 0 24px;animation:fadeUp .3s ease-out both\">\n            <div style=\"padding:18px 22px\">\n              <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Detalle · por qué más recursos no bastan<\u002Fspan>\n              <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\">El dinero mejora aprendizajes solo si compra mejores insumos que a su vez cambien las prácticas pedagógicas. La evidencia de California sobre el LCFF apunta al gasto en docencia —menor tamaño de curso, mejores salarios y menor rotación docente— como el insumo con mayor efecto, con impactos acumulativos y reducción de repitencia (Johnson, 2023).<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <h2 id=\"res-equidad\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Equidad en la distribución<\u002Fh2>\n        <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">En el análisis comparado del financiamiento escolar en América Latina, Chile aparece como <strong>consistentemente progresivo, incluso a nivel de estudiante<\u002Fstrong> —no solo entre regiones—, y la SEP se identifica como su mecanismo progresivo principal (Bertoni et al., 2023).<\u002Fp>\n        <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">Es un resultado poco común: en la región, la progresividad suele lograrse entre territorios pero diluirse dentro de ellos.<\u002Fp>\n\n        <h2 id=\"res-adecuacion\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Adecuación y costo-efectividad<\u002Fh2>\n        <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">En términos de adecuación, la evaluación es favorable: la SEP incrementó los recursos disponibles sin disminuir los existentes, un factor que también explica su viabilidad política.<\u002Fp>\n        <button sc-camel-on-click=\"{{ deep.r2.toggle }}\" aria-expanded=\"{{ deep.r2.open }}\" style=\"border:none;background:none;padding:0;font:inherit;font-size:14px;font-weight:600;color:#0D4A57;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-bottom:1.5px dotted #0D4A57;margin-bottom:8px\">Más detalle sobre este punto<span aria-hidden=\"true\" style=\"font-size:11px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ deep.r2.open }}\">\n          <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:8px 0 24px;animation:fadeUp .3s ease-out both\">\n            <div style=\"padding:18px 22px\">\n              <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Referencia externa<\u002Fspan>\n              <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\">En Estados Unidos, aumentos de gasto en distritos vulnerables derivados de fallos judiciales muestran que un 10% más de gasto anual por estudiante se asocia a 0,31 años adicionales de escolaridad, 7% más de salarios y 3,2 puntos porcentuales menos de pobreza adulta, con efectos mucho mayores en niños de familias de bajos ingresos (Jackson et al., 2016).<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <h2 id=\"res-limites\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Límites de la evidencia<\u002Fh2>\n        <ul style=\"padding-left:22px;margin:0 0 20px;display:flex;flex-direction:column;gap:10px\">\n          <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\">Atribuir causalidad entre financiamiento y aprendizajes es difícil: la SEP opera junto al sistema de aseguramiento de la calidad y a la Ley de Inclusión.<\u002Fli>\n          <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\">Los efectos se miden mayormente con pruebas estandarizadas, que capturan una parte del objetivo educativo.<\u002Fli>\n          <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\">La progresividad del gasto público convive con un gasto privado alto, que opera en sentido regresivo.<\u002Fli>\n        <\u002Ful>\n\n        <div style=\"display:flex;justify-content:flex-end;margin:48px 0 0;padding-top:24px;border-top:1px solid #DCE3E1\" data-noprint=\"\">\n          <button sc-camel-on-click=\"{{ goNext }}\" style=\"font-family:'Google Sans',sans-serif;background:none;color:#0D4A57;border:1.5px solid #0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">{{ nextLabel }}\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isMedia }}\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px\">\n    <sc-for list=\"{{ media }}\" as=\"m\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ m.play }}\" style=\"{{ m.cardStyle }}\" style-hover=\"border-color:#8BC53F\">\n        <div style=\"position:relative;aspect-ratio:16/9;background:#0D4A57;display:flex;align-items:center;justify-content:center\">\n          <span style=\"position:absolute;top:12px;left:12px;background:#fff;color:#0D4A57;font-family:'Google Sans',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:6px\">{{ m.type }}<\u002Fspan>\n          <span style=\"width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"#0D4A57\" aria-hidden=\"true\"><polygon points=\"6 3 20 12 6 21 6 3\"><\u002Fpolygon><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"position:absolute;bottom:12px;right:12px;background:rgba(23,36,42,.75);color:#fff;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px\">{{ m.duration }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px 20px;text-align:left\">\n          <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:15px;color:#17242A;margin:0 0 6px;line-height:1.35\">{{ m.title }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8CA0A5\">{{ m.meta }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRecursos }}\">\n  <div>\n    <h3 style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin:0 0 16px\">Gráficos y datos<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:44px\">\n      <sc-for list=\"{{ resources }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid #DCE3E1;border-radius:16px;overflow:hidden;display:flex;flex-direction:column\">\n          <div style=\"height:6px;background:{{ r.color }}\"><\u002Fdiv>\n          <div style=\"padding:20px 22px;display:flex;flex-direction:column;gap:14px;flex:1\">\n            <div style=\"flex:1\">\n              <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:14.5px;color:#17242A;line-height:1.35;margin-bottom:6px\">{{ r.title }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8CA0A5\">{{ r.meta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ r.open }}\" style=\"font-family:'Google Sans',sans-serif;font-size:12px;font-weight:600;border:1.5px solid #0D4A57;color:#0D4A57;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">Ver y exportar<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ r.csv }}\" style=\"font-family:'Google Sans',sans-serif;font-size:12px;font-weight:600;border:1px solid #DCE3E1;color:#516268;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;transition:border-color .15s,color .15s\" style-hover=\"border-color:#0D4A57;color:#0D4A57\">CSV<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin:0 0 16px\">Informes<\u002Fh3>\n    <div style=\"margin:0 0 24px\" data-noprint=\"\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px solid #DCE3E1;border-radius:16px;padding:24px 28px;margin-bottom:20px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:16px\">\n        <span style=\"width:44px;height:44px;border-radius:10px;background:#0D4A57;display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><line x1=\"12\" y1=\"18\" x2=\"12\" y2=\"12\"><\u002Fline><polyline points=\"9 15 12 18 15 15\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fspan>\n        <div>\n          <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:15.5px;color:#17242A\">Informe completo del caso<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8CA0A5;margin-top:2px\">PDF · 47 páginas · 3.4 MB<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ doPrint }}\" style=\"font-family:'Google Sans',sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:13px;letter-spacing:.03em;padding:11px 20px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">\n          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3v12\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"4\" y1=\"20\" x2=\"20\" y2=\"20\"><\u002Fline><\u002Fsvg>DESCARGAR RESUMEN\n        <\u002Fbutton>\n        <button style=\"font-family:'Google Sans',sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:13px;letter-spacing:.03em;padding:11px 20px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">\n          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3v12\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"4\" y1=\"20\" x2=\"20\" y2=\"20\"><\u002Fline><\u002Fsvg>DESCARGAR PDF COMPLETO\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px dashed #DCE3E1;border-radius:16px;padding:22px 26px\">\n      <div style=\"font-family:'Google Sans',sans-serif;font-size:14px;font-weight:700;color:#17242A;margin-bottom:8px\">¿Buscas algo puntual sin leer todo el informe?<\u002Fdiv>\n      <p style=\"font-size:13.5px;color:#516268;line-height:1.55;margin:0 0 16px\">Puedes cargar el PDF completo en Claude o ChatGPT y preguntarle directamente. Copia este prompt como punto de partida:<\u002Fp>\n      <div style=\"background:#F4F7F6;border-radius:10px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap\">\n        <code style=\"font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;line-height:1.6;color:#33444A;white-space:pre-wrap;flex:1;min-width:220px\">Adjunto el informe sobre mecanismos de financiamiento general y progresivo en educación, que incluye el caso de la Subvención Escolar Preferencial (Chile). Actúa como analista de políticas educativas: responde solo con base en este documento, indicando la sección o página cuando sea posible. Empieza con un resumen de los hallazgos principales y luego espera mis preguntas.<\u002Fcode>\n        <button sc-camel-on-click=\"{{ copyPrompt }}\" style=\"{{ copyPromptStyle }}\">{{ copyPromptLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isBibliografia }}\">\n  <div>\n    <p style=\"font-size:14.5px;color:#516268;line-height:1.6;max-width:700px;margin:0 0 32px\">Fuentes utilizadas en la elaboración del caso y formatos de citación listos para copiar.<\u002Fp>\n    <div style=\"display:flex;gap:48px;align-items:flex-start;flex-wrap:wrap\">\n      <div style=\"flex:1;min-width:280px\">\n        <h3 style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin:0 0 14px\">Fuentes<\u002Fh3>\n        <ul style=\"padding-left:20px;margin:0 0 8px;display:flex;flex-direction:column;gap:8px\">\n          <li style=\"font-size:13.5px;color:#516268;line-height:1.6\">Hernández J., T. (2026). Revisión de mecanismos de financiamiento general y progresivo en educación: marco conceptual y mapeo de iniciativas. SUMMA.<\u002Fli>\n          <li style=\"font-size:13.5px;color:#516268;line-height:1.6\">Ley N°20.248 (2008), Ley N°20.550 (2011) y Ley N°20.845 (2015), Chile.<\u002Fli>\n          <li style=\"font-size:13.5px;color:#516268;line-height:1.6\">Mizala, A. &amp; Torche, F. (2013). Efectos de la Subvención Escolar Preferencial en los resultados de aprendizaje.<\u002Fli>\n          <li style=\"font-size:13.5px;color:#516268;line-height:1.6\">Bertoni, E. et al. (2023). Is school funding unequal in Latin America? Comparative Education Review, 67(1).<\u002Fli>\n          <li style=\"font-size:13.5px;color:#516268;line-height:1.6\">Elacqua, G. et al. (2025). Smart spending in education in Latin America and the Caribbean. BID.<\u002Fli>\n          <li style=\"font-size:13.5px;color:#516268;line-height:1.6\">OCDE (2017). The Funding of School Education: Connecting Resources and Learning. Fazekas, M. (2012). School funding formulas (OECD Working Paper N°74).<\u002Fli>\n        <\u002Ful>\n        <div style=\"margin-top:32px\">\n          <div style=\"font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#8CA0A5;margin-bottom:6px\">Cómo citar — Texto<\u002Fdiv>\n          <div style=\"background:#F4F7F6;border-radius:10px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap\">\n            <code style=\"font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;line-height:1.6;color:#33444A;white-space:pre-wrap;flex:1;min-width:200px\">SUMMA. (2026). Subvención Escolar Preferencial: financiamiento progresivo integrado en la fórmula de subvención escolar en Chile. Plataforma de Reformas Educativas, SUMMA/BID.<\u002Fcode>\n            <button sc-camel-on-click=\"{{ copyCite }}\" style=\"{{ copyCiteStyle }}\" data-noprint=\"\">{{ copyCiteLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:32px\">\n          <div style=\"font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#8CA0A5;margin-bottom:6px\">Cómo citar — BibTeX<\u002Fdiv>\n          <div style=\"background:#F4F7F6;border-radius:10px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap\">\n            <code style=\"font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;line-height:1.6;color:#33444A;white-space:pre-wrap;flex:1;min-width:200px\">@misc{summa2026sep,\n  author = {SUMMA},\n  title = {Subvención Escolar Preferencial: financiamiento progresivo en Chile},\n  year = {2026},\n  institution = {SUMMA/BID},\n  howpublished = {Plataforma de Reformas Educativas}\n}<\u002Fcode>\n            <button sc-camel-on-click=\"{{ copyBib }}\" style=\"{{ copyBibStyle }}\" data-noprint=\"\">{{ copyBibLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:290px;flex-shrink:0;background:#EEF6E2;border-radius:16px;padding:26px 24px\">\n        <span style=\"display:inline-flex;align-items:center;gap:7px;background:#8BC53F;color:#17242A;font-family:'Google Sans',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.04em;padding:8px 14px;border-radius:999px;margin-bottom:14px\">\n          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>VALIDADO POR COMITÉ EXPERTO\n        <\u002Fspan>\n        <p style=\"font-size:13px;line-height:1.55;color:#3D4E52;margin:0 0 22px\">Revisado por el comité académico especializado del proyecto, integrado por especialistas en financiamiento y política educativa de la región.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <sc-for list=\"{{ committee }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <span role=\"img\" aria-label=\"{{ p.name }}\" style=\"width:46px;height:46px;border-radius:50%;flex-shrink:0;background-color:#DCE3E1;border:2px solid #fff;background-image:{{ p.photoUrl }};background-size:cover;background-position:center\"><\u002Fspan>\n              <div>\n                <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:13.5px;color:#17242A;line-height:1.3\">{{ p.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#516268;line-height:1.4;margin-top:2px\">{{ p.role }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;background:#F4F7F6;border-radius:16px;padding:28px 32px;margin:64px 0 0;flex-wrap:wrap\" data-noprint=\"\">\n    <p style=\"font-family:'Google Sans',sans-serif;font-size:17px;color:#0D4A57;margin:0\">¿Cómo se compara con otros mecanismos de financiamiento progresivo?<\u002Fp>\n    <button sc-camel-on-click=\"{{ openCompare }}\" style=\"font-family:'Google Sans',sans-serif;background:none;color:#0D4A57;border:1.5px solid #0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">COMPARAR CON OTROS CASOS\n      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><polyline points=\"15 3 21 3 21 9\"><\u002Fpolyline><line x1=\"10\" y1=\"14\" x2=\"21\" y2=\"3\"><\u002Fline><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <footer style=\"border-top:1px solid #DCE3E1;padding:36px 0 60px;margin-top:56px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:#7C8B8D\">\n    <img src=\"d60cf43f-c0ea-49fd-b530-e849c730e07d\" alt=\"SUMMA\" style=\"height:34px;width:auto;object-fit:contain\">\n    <span>Plataforma de Reformas Educativas · SUMMA / BID · 2026<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<sc-if value=\"{{ chartOpen }}\">\n  <div sc-camel-on-click=\"{{ backdropClose }}\" style=\"position:fixed;inset:0;background:rgba(23,36,42,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeUp .2s ease-out both\" data-noprint=\"\">\n    <div role=\"dialog\" aria-modal=\"true\" aria-label=\"{{ chartTitle }}\" style=\"background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 26px 0\">\n        <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:17px;color:#0D4A57\">{{ chartTitle }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeChart }}\" aria-label=\"Cerrar\" style=\"width:32px;height:32px;border-radius:50%;border:1px solid #DCE3E1;background:#fff;cursor:pointer;font-size:15px;color:#17242A;line-height:1;flex-shrink:0\" style-hover=\"background:#F4F7F6\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px;padding:18px 26px 0\">\n        <button sc-camel-on-click=\"{{ setViz }}\" style=\"{{ vizTabStyle }}\">Visualización<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ setData }}\" style=\"{{ dataTabStyle }}\">Datos<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:24px 26px;flex:1;overflow:auto;min-height:220px\">\n        <sc-if value=\"{{ isViz }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#F4F7F6;border-radius:10px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:220px\">{{ modalChart }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isData }}\">\n          <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-for list=\"{{ modalColumns }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <sc-raw-th style=\"text-align:left;font-family:'Google Sans',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8CA0A5;font-weight:700;padding:8px 10px;border-bottom:1px solid #DCE3E1\">{{ c.label }}<\u002Fsc-raw-th>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ modalRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #F4F7F6;color:#33444A\">{{ r.a }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #F4F7F6;color:#33444A;font-family:'Google Sans',sans-serif;font-weight:600\">{{ r.b }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;justify-content:flex-end;padding:16px 26px 22px;border-top:1px solid #DCE3E1\">\n        <button sc-camel-on-click=\"{{ exportCsv }}\" style=\"font-family:'Google Sans',sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:12px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">CSV<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ exportSvg }}\" style=\"font-family:'Google Sans',sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:12px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">SVG<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ exportPng }}\" style=\"font-family:'Google Sans',sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:12px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">PNG<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ compareOpen }}\">\n  <div sc-camel-on-click=\"{{ backdropCloseCompare }}\" style=\"position:fixed;inset:0;background:rgba(23,36,42,.55);display:flex;justify-content:flex-end;z-index:210;animation:fadeUp .2s ease-out both\" data-noprint=\"\">\n    <aside role=\"dialog\" aria-modal=\"true\" aria-label=\"Comparar mecanismos de financiamiento progresivo\" style=\"background:#fff;width:min(780px,100%);height:100%;overflow:auto;padding:clamp(24px,3vw,36px)\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px\">\n        <div>\n          <div style=\"font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#6FA030;margin-bottom:6px\">Comparador · Financiamiento progresivo<\u002Fdiv>\n          <h2 style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:24px;color:#0D4A57;margin:0\">Tres mecanismos, lado a lado<\u002Fh2>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeCompare }}\" aria-label=\"Cerrar comparador\" style=\"width:36px;height:36px;border-radius:50%;border:1px solid #DCE3E1;background:#fff;cursor:pointer;font-size:16px;color:#17242A;flex-shrink:0\" style-hover=\"background:#F4F7F6\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"font-size:14px;line-height:1.6;color:#516268;margin:12px 0 24px\">Los tres buscan mayor equidad en la distribución, pero difieren en la unidad de focalización, el grado de libertad de uso y la fuerza del respaldo legal.<\u002Fp>\n      <div style=\"overflow-x:auto\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"text-align:left;font-family:'Google Sans',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8CA0A5;font-weight:700;padding:10px;border-bottom:1px solid #DCE3E1\">Dimensión<\u002Fsc-raw-th>\n              <sc-for list=\"{{ compareCases }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <sc-raw-th style=\"text-align:left;font-family:'Google Sans',sans-serif;font-size:12px;color:{{ c.color }};font-weight:700;padding:10px;border-bottom:1px solid #DCE3E1;line-height:1.35\">{{ c.name }}<span style=\"display:block;font-weight:400;color:#8CA0A5;font-size:11px;margin-top:2px\">{{ c.country }}<\u002Fspan><\u002Fsc-raw-th>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ compareRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"padding:11px 10px;border-bottom:1px solid #F4F7F6;font-family:'Google Sans',sans-serif;font-weight:600;color:#17242A;vertical-align:top\">{{ r.dim }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:11px 10px;border-bottom:1px solid #F4F7F6;color:#0D4A57;background:#F4F7F6;font-weight:600;vertical-align:top\">{{ r.a }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:11px 10px;border-bottom:1px solid #F4F7F6;color:#516268;vertical-align:top\">{{ r.b }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:11px 10px;border-bottom:1px solid #F4F7F6;color:#516268;vertical-align:top\">{{ r.c }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <p style=\"font-size:12.5px;line-height:1.55;color:#8CA0A5;margin:20px 0 0\">La columna destacada corresponde al caso que estás viendo. Elaborado a partir de las fichas de mapeo del informe de financiamiento (SUMMA, 2026).<\u002Fp>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toastText }}\">\n  <div role=\"status\" style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#17242A;color:#fff;font-family:'Google Sans',sans-serif;font-size:13.5px;font-weight:500;padding:12px 20px;border-radius:999px;z-index:300;box-shadow:0 8px 24px rgba(23,36,42,.3);animation:fadeUp .25s ease-out both\" data-noprint=\"\">{{ toastText }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst LINE = [\n  {year:'2008', v:42, cx:80, cy:98},\n  {year:'2012', v:38, cx:200, cy:110},\n  {year:'2016', v:35, cx:320, cy:118},\n  {year:'2019', v:31, cx:440, cy:129},\n  {year:'2023', v:28, cx:560, cy:138}\n];\nconst BARS = [\n  {year:'2008', v:'5,2', x:35, y:88, h:62},\n  {year:'2012', v:'6,8', x:90, y:69, h:81},\n  {year:'2016', v:'7,9', x:145, y:56, h:94},\n  {year:'2019', v:'8,6', x:200, y:47, h:103},\n  {year:'2023', v:'9,1', x:255, y:41, h:109}\n];\nconst PIE = [\n  {label:'Prioritarios', pct:43, color:'#0D4A57'},\n  {label:'Preferentes', pct:22, color:'#E8A33D'},\n  {label:'Resto de la matrícula', pct:35, color:'#6C90A3'}\n];\nconst CHARTS = {\n  line:{title:'Brecha de puntaje en lectura (puntos)', columns:['Año','Brecha en puntos'], rows:LINE.map(function(p){return [p.year, String(p.v)];})},\n  bar:{title:'Escuelas con convenio SEP y PME (miles)', columns:['Año','Escuelas (miles)'], rows:BARS.map(function(b){return [b.year, b.v];})},\n  pie:{title:'Matrícula por categoría de elegibilidad', columns:['Categoría','% de la matrícula'], rows:PIE.map(function(p){return [p.label, p.pct+'%'];})}\n};\nconst TABS = [\n  ['resumen','Resumen'],\n  ['contexto','Contexto'],\n  ['diseno','Diseño'],\n  ['implementacion','Implementación'],\n  ['resultados','Resultados'],\n  ['lecciones','Lecciones'],\n  ['recursos','Recursos'],\n  ['bibliografia','Bibliografía'],\n  ['multimedia','Multimedia']\n];\nconst NEXT = {\n  contexto:['diseno','Diseño'],\n  diseno:['implementacion','Implementación'],\n  implementacion:['resultados','Resultados'],\n  resultados:['lecciones','Lecciones'],\n  lecciones:['recursos','Recursos']\n};\nconst TOCS = {\n  resumen:[],\n  contexto:[['ctx-panorama','Panorama del sistema'],['ctx-problema','Diagnóstico'],['ctx-objetivos','Objetivos declarados']],\n  diseno:[['dis-mecanismo','Categoría del mecanismo'],['dis-focalizacion','Focalización'],['dis-calculo','Mecanismo de cálculo'],['dis-usos','Usos y autonomía'],['dis-info','Información y rendición']],\n  implementacion:[['imp-legal','Marco legal'],['imp-capacidad','Capacidad técnica'],['imp-ajustes','Ajustes'],['imp-monitoreo','Monitoreo']],\n  resultados:[['res-aprendizajes','Aprendizajes'],['res-equidad','Equidad'],['res-adecuacion','Adecuación'],['res-limites','Límites de la evidencia']],\n  lecciones:[['lec-factores','Factores críticos'],['lec-sostenibilidad','Sostenibilidad'],['lec-transfer','Transferibilidad']],\n  recursos:[],\n  bibliografia:[],\n  multimedia:[]\n};\nconst DEEP_IDS = ['c1','c2','c3','d1','d2','d3','i1','i2','r1','r2','l1','l2'];\n\nclass Component extends DCLogic {\n  state = {\n    tab:'resumen', tip:null, barTip:null, pieHover:null, open:{},\n    chart:null, chartMode:'viz', compare:false, toast:null, copied:{},\n    activeToc:0, wide:true, scrolled:false\n  };\n\n  componentDidMount(){\n    this.onScroll = () => {\n      const list = TOCS[this.state.tab] || [];\n      let idx = 0;\n      const pos = window.scrollY + 130;\n      list.forEach(function(t,i){\n        const el = document.getElementById(t[0]);\n        if(el && el.getBoundingClientRect().top + window.pageYOffset <= pos) idx = i;\n      });\n      if(idx !== this.state.activeToc) this.setState({activeToc:idx});\n      const sc = window.scrollY > 8;\n      if(sc !== this.state.scrolled) this.setState({scrolled:sc});\n    };\n    this.onResize = () => {\n      const wide = window.innerWidth >= 1320;\n      if(wide !== this.state.wide) this.setState({wide:wide});\n    };\n    this.onKey = (e) => { if(e.key === 'Escape') this.setState({chart:null, compare:false}); };\n    window.addEventListener('scroll', this.onScroll, {passive:true});\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('keydown', this.onKey);\n    this.onResize(); this.onScroll();\n  }\n  componentWillUnmount(){\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('keydown', this.onKey);\n  }\n\n  toast(text){\n    this.setState({toast:text});\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({toast:null}), 2200);\n  }\n  copy(key, text, label){\n    const done = () => {\n      const copied = Object.assign({}, this.state.copied); copied[key] = true;\n      this.setState({copied:copied});\n      setTimeout(() => {\n        const c = Object.assign({}, this.state.copied); delete c[key];\n        this.setState({copied:c});\n      }, 1800);\n      this.toast(label + ' copiado al portapapeles');\n    };\n    if(navigator.clipboard && navigator.clipboard.writeText){\n      navigator.clipboard.writeText(text).then(done).catch(done);\n    } else {\n      const ta = document.createElement('textarea');\n      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';\n      document.body.appendChild(ta); ta.select();\n      try{ document.execCommand('copy'); }catch(e){}\n      document.body.removeChild(ta); done();\n    }\n  }\n  copyBtnStyle(key){\n    const on = !!this.state.copied[key];\n    return \"font-family:'Google Sans
