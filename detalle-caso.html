  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

,4vw,40px);max-width:1240px;margin:0 auto\">\n    <a href=\"#\" style=\"display:block\"><img src=\"d60cf43f-c0ea-49fd-b530-e849c730e07d\" alt=\"SUMMA — Plataforma de Reformas Educativas\" style=\"height:34px;width:auto\"><\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:clamp(16px,2.5vw,34px);font-family:'Google Sans',sans-serif;font-size:14.5px;color:#0D4A57\">\n      <a href=\"marco-wise.html\" style=\"color:#0D4A57\">Marco WISE<\u002Fa>\n      <a href=\"lineas-de-reforma.html\" style=\"color:#0D4A57\">Líneas de Reforma<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <button aria-label=\"Buscar\" style=\"width:40px;height:40px;border-radius:50%;border:1.5px solid #0D4A57;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s\" style-hover=\"background:#0D4A57;color:#fff\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"color:#0D4A57\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"><\u002Fline><\u002Fsvg>\n      <\u002Fbutton>\n      <button style=\"font-family:'Google Sans',sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">EXPLORAR CASOS<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fnav>\n<\u002Fdiv>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;font-family:'Google Sans',sans-serif;font-size:12.5px;font-weight:500;color:#7C8B8D;margin:26px 0 22px\" data-noprint=\"\">\n    <a href=\"#\" style=\"color:#7C8B8D\">Inicio<\u002Fa><span style=\"color:#C2CCCE\">/<\u002Fspan><a href=\"#\" style=\"color:#7C8B8D\">Líneas de Reforma<\u002Fa><span style=\"color:#C2CCCE\">/<\u002Fspan><a href=\"financiamiento-progresivo.html\" style=\"color:#7C8B8D\">Financiamiento progresivo<\u002Fa><span style=\"color:#C2CCCE\">/<\u002Fspan><span style=\"color:#0D4A57;font-weight:600\">Subvención Escolar Preferencial<\u002Fspan>\n  <\u002Fdiv>\n\n  <header>\n    <span style=\"display:inline-flex;align-items:center;gap:6px;background:#EEF6E2;color:#6FA030;font-family:'Google Sans',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:6px 14px;border-radius:6px;margin-bottom:16px\">Financiamiento progresivo<\u002Fspan>\n    <h1 style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(30px,4.4vw,44px);line-height:1.14;letter-spacing:-.01em;color:#0D4A57;margin:0 0 16px;max-width:800px;text-wrap:pretty\">Subvención Escolar Preferencial (SEP)<\u002Fh1>\n    <p style=\"font-size:16.5px;line-height:1.6;color:#3D4E52;max-width:700px;margin:0 0 32px;text-wrap:pretty\">Reforma que incorporó la equidad vertical en el mecanismo principal de financiamiento escolar de Chile: un pago adicional por cada estudiante prioritario, con uso condicionado a un plan de mejoramiento y rendición de cuentas.<\u002Fp>\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:32px;padding-bottom:32px;border-bottom:1px solid #DCE3E1\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px 40px\">\n        <div><span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:6px\">País<\u002Fspan><span style=\"font-family:'Google Sans',sans-serif;font-size:15px;font-weight:600\">Chile<\u002Fspan><\u002Fdiv>\n        <div><span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:6px\">Línea de reforma<\u002Fspan><span style=\"font-family:'Google Sans',sans-serif;font-size:15px;font-weight:600\">Financiamiento progresivo<\u002Fspan><\u002Fdiv>\n        <div><span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:6px\">Vigencia<\u002Fspan><span style=\"font-family:'Google Sans',sans-serif;font-size:15px;font-weight:600\">2008 – actualidad<\u002Fspan><\u002Fdiv>\n        <div><span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:6px\">Tipo de mecanismo<\u002Fspan><span style=\"font-family:'Google Sans',sans-serif;font-size:15px;font-weight:600\">Weighted Student Funding<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openCompare }}\" style=\"font-family:'Google Sans',sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\" data-noprint=\"\">COMPARAR CON OTROS CASOS\n        <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><polyline points=\"15 3 21 3 21 9\"><\u002Fpolyline><line x1=\"10\" y1=\"14\" x2=\"21\" y2=\"3\"><\u002Fline><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div role=\"tablist\" aria-label=\"Secciones del estudio de caso\" style=\"display:flex;gap:clamp(14px,2.2vw,28px);border-bottom:1px solid #DCE3E1;margin:48px 0 44px;flex-wrap:wrap\" data-noprint=\"\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"7\">\n      <button role=\"tab\" aria-selected=\"{{ t.selected }}\" sc-camel-on-click=\"{{ t.select }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;max-width:700px;margin:0 auto\">\n    <nav aria-label=\"Índice de la sección\" style=\"position:absolute;top:0;left:-230px;width:175px;height:100%;display:{{ tocDisplay }}\" data-noprint=\"\">\n      <div style=\"position:sticky;top:100px;padding-top:6px\">\n        <div style=\"font-family:'Google Sans',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#B4C2C4;margin:0 0 10px 4px\">{{ tocTitle }}<\u002Fdiv>\n        <sc-for list=\"{{ toc }}\" as=\"i\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ i.go }}\" style=\"{{ i.style }}\">\n            <span style=\"position:absolute;left:8px;top:-2px;bottom:-2px;width:1.5px;background:#DCE3E1\"><\u002Fspan>\n            <span style=\"position:relative;z-index:1;width:{{ i.dotSize }};height:{{ i.dotSize }};border-radius:50%;background:{{ i.dotBg }};border:2px solid {{ i.dotBorder }};flex-shrink:0;transition:all .15s\"><\u002Fspan>\n            <span style=\"font-family:'Google Sans',sans-serif;font-size:13.5px;font-weight:{{ i.weight }};color:{{ i.color }};line-height:1.35;text-align:left;transition:color .15s\">{{ i.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <sc-if value=\"{{ isContexto }}\" hint-placeholder-val=\"{{ true }}\">\n    <article>\n      <div style=\"display:flex;align-items:flex-start;gap:12px;background:#EEF6E2;border-radius:16px;padding:16px 20px;margin:0 0 40px\" data-noprint=\"\">\n        <span aria-hidden=\"true\" style=\"font-size:16px;line-height:1.4;color:#6FA030\">⊕<\u002Fspan>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#6FA030;font-weight:500\">Los textos con <strong>línea punteada<\u002Fstrong> y los enlaces <strong>“Más detalle sobre este punto”<\u002Fstrong> se abren con un clic para ver la evidencia. Vuelve a hacer clic para cerrarlos.<\u002Fp>\n      <\u002Fdiv>\n\n      <h2 id=\"ctx-panorama\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:0 0 20px;scroll-margin-top:100px\">Panorama del sistema al momento de la reforma<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">Chile financia la educación escolar con una <button sc-camel-on-click=\"{{ deep.c1.toggle }}\" aria-expanded=\"{{ deep.c1.open }}\" style=\"border:none;background:none;padding:0;font:inherit;border-bottom:1.5px dotted #0D4A57;cursor:pointer;font-weight:600;color:#0D4A57\">transferencia per cápita desde el gobierno central<span aria-hidden=\"true\" style=\"font-size:11px;margin-left:3px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton> a los sostenedores de las escuelas, calculada según matrícula y asistencia, nivel de enseñanza y características de la escuela y de la población que atiende. Es uno de los sistemas más centralizados de la región en su asignación inicial.<\u002Fp>\n      <sc-if value=\"{{ deep.c1.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:4px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Detalle<\u002Fspan>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\">Cerca del 98% de los recursos públicos se asignan inicialmente desde el nivel central; la cifra baja a 63% al considerar las transferencias hacia el nivel local, que ejecuta el gasto. Chile también destaca por una participación privada alta en el gasto escolar (en torno al 22% en educación primaria, frente a un promedio OCDE cercano al 6%), fuente que tiende a ser regresiva.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <h2 id=\"ctx-problema\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Diagnóstico y problema público<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">El problema no era solo cuánto se gastaba, sino cómo se distribuía: una fórmula que pagaba lo mismo por cada estudiante ignoraba que educar a niños en desventaja socioeconómica cuesta más. La literatura llama a esto un déficit de <button sc-camel-on-click=\"{{ deep.c2.toggle }}\" aria-expanded=\"{{ deep.c2.open }}\" style=\"border:none;background:none;padding:0;font:inherit;border-bottom:1.5px dotted #0D4A57;cursor:pointer;font-weight:600;color:#0D4A57\">equidad vertical<span aria-hidden=\"true\" style=\"font-size:11px;margin-left:3px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton>.<\u002Fp>\n      <sc-if value=\"{{ deep.c2.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:4px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Detalle · dos formas de equidad<\u002Fspan>\n            <p style=\"margin:0 0 10px;font-size:14px;color:#3D4E52;line-height:1.65\"><strong>Equidad horizontal:<\u002Fstrong> estudiantes similares reciben recursos similares, sin importar la escuela o el territorio.<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\"><strong>Equidad vertical:<\u002Fstrong> estudiantes con mayores necesidades reciben más recursos. Es el fundamento del financiamiento progresivo, y ambos objetivos son complementarios dentro de una misma fórmula (Fazekas, 2012; Elacqua et al., 2025).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La evidencia internacional refuerza el diagnóstico: superado un umbral mínimo de gasto, no se observa relación entre el gasto acumulado por estudiante y su desempeño. Lo que pasa a ser determinante es el diseño del mecanismo de asignación y la distribución final de los recursos.<\u002Fp>\n      <button sc-camel-on-click=\"{{ deep.c3.toggle }}\" aria-expanded=\"{{ deep.c3.open }}\" style=\"border:none;background:none;padding:0;font:inherit;font-size:14px;font-weight:600;color:#0D4A57;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-bottom:1.5px dotted #0D4A57;margin-bottom:8px\">Más detalle sobre este punto<span aria-hidden=\"true\" style=\"font-size:11px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ deep.c3.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:8px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Adecuación y distribución<\u002Fspan>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\">La <strong>adecuación<\u002Fstrong> pregunta cuánto cuesta ofrecer educación de calidad a todos y si ese gasto es sostenible; la <strong>distribución<\u002Fstrong> pregunta cómo se reparte. América Latina elevó su inversión educativa del 3% al 5% del PIB entre 1995 y 2014, pero retrocedió a 3,9% en 2022 por la presión fiscal post-pandemia. En paralelo, los estudiantes indígenas presentan las brechas de escolarización y aprendizaje más pronunciadas de la región (OCDE, 2017 y 2023; Elacqua et al., 2025).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <h2 id=\"ctx-objetivos\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Objetivos declarados<\u002Fh2>\n      <ul style=\"padding-left:22px;margin:0 0 20px;display:flex;flex-direction:column;gap:10px\">\n        <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\">Incorporar la progresividad <strong>dentro<\u002Fstrong> del mecanismo general de subvención, no como programa paralelo.<\u002Fli>\n        <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\">Aumentar los recursos de las escuelas que concentran estudiantes vulnerables, sin reducir los existentes.<\u002Fli>\n        <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\">Vincular los recursos adicionales a compromisos de mejora pedagógica verificables.<\u002Fli>\n      <\u002Ful>\n      <div style=\"display:flex;align-items:flex-start;gap:12px;background:#FBF0DF;border-radius:16px;padding:16px 20px;margin:32px 0 0\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"flex-shrink:0;margin-top:2px;color:#B4791F\" aria-hidden=\"true\"><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><\u002Fsvg>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#B4791F;font-weight:500\"><strong>Condición de partida:<\u002Fstrong> la SEP fue posible porque existía un registro socioeconómico de hogares capaz de identificar individualmente a los estudiantes elegibles. Sin sistemas de información de esa calidad, la focalización individual no es viable.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;justify-content:flex-end;margin:48px 0 0;padding-top:24px;border-top:1px solid #DCE3E1\" data-noprint=\"\">\n        <button sc-camel-on-click=\"{{ goNext }}\" style=\"font-family:'Google Sans',sans-serif;background:none;color:#0D4A57;border:1.5px solid #0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">{{ nextLabel }}\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDiseno }}\">\n    <article>\n      <div style=\"display:flex;align-items:flex-start;gap:12px;background:#EEF6E2;border-radius:16px;padding:16px 20px;margin:0 0 40px\" data-noprint=\"\">\n        <span aria-hidden=\"true\" style=\"font-size:16px;line-height:1.4;color:#6FA030\">⊕<\u002Fspan>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#6FA030;font-weight:500\">Los textos con <strong>línea punteada<\u002Fstrong> y los enlaces <strong>“Más detalle sobre este punto”<\u002Fstrong> se abren con un clic para ver la evidencia. Vuelve a hacer clic para cerrarlos.<\u002Fp>\n      <\u002Fdiv>\n\n      <h2 id=\"dis-mecanismo\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:0 0 20px;scroll-margin-top:100px\">Categoría del mecanismo<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La SEP es un <button sc-camel-on-click=\"{{ deep.d1.toggle }}\" aria-expanded=\"{{ deep.d1.open }}\" style=\"border:none;background:none;padding:0;font:inherit;border-bottom:1.5px dotted #0D4A57;cursor:pointer;font-weight:600;color:#0D4A57\">Weighted Student Funding (WSF)<span aria-hidden=\"true\" style=\"font-size:11px;margin-left:3px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton> integrado en la fórmula principal de subvención escolar: el presupuesto de cada escuela se determina multiplicando su matrícula por montos que varían según las características de los estudiantes.<\u002Fp>\n      <sc-if value=\"{{ deep.d1.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:4px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Detalle · variables típicas de una fórmula WSF<\u002Fspan>\n            <p style=\"margin:0 0 8px;font-size:14px;color:#3D4E52;line-height:1.65\"><strong>Básicas:<\u002Fstrong> matrícula por nivel y modalidad. <strong>De necesidad:<\u002Fstrong> pobreza, aprendiz del idioma oficial, discapacidad o NEE, pertenencia indígena.<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\"><strong>De currículo o programa:<\u002Fstrong> jornada extendida, enseñanza bilingüe. <strong>Institucionales:<\u002Fstrong> tamaño, ruralidad o aislamiento, tipo de sostenedor (Fazekas, 2012).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <h2 id=\"dis-focalizacion\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Focalización<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La focalización es <strong>individual<\u002Fstrong> y el monto sigue al estudiante hasta la escuela que lo matricula. Se distinguen dos categorías: <strong>alumnos prioritarios<\u002Fstrong> —principalmente el tercio más vulnerable del Registro Social de Hogares— y <strong>alumnos preferentes<\u002Fstrong>, dentro del 80% más vulnerable y no prioritarios.<\u002Fp>\n      <div style=\"display:flex;gap:20px;background:#F4F7F6;border-radius:16px;padding:24px 26px;margin:32px 0;flex-wrap:wrap\">\n        <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:36px;color:#6FA030;line-height:1\">50–70%<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#516268;line-height:1.5;padding-top:4px;flex:1;min-width:200px\">de subvención adicional aproximada por cada alumno prioritario, sobre la subvención base, más un subsidio diferenciado a escuelas con alta concentración de prioritarios.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 id=\"dis-calculo\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Mecanismo de cálculo<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">Al monto base —el costo estimado de educar a un estudiante sin necesidades adicionales— se suma la subvención preferencial por cada estudiante elegible. El resultado es automático: las escuelas que atienden más estudiantes vulnerables reciben más recursos por alumno, sin negociación ni concurso.<\u002Fp>\n      <button sc-camel-on-click=\"{{ deep.d2.toggle }}\" aria-expanded=\"{{ deep.d2.open }}\" style=\"border:none;background:none;padding:0;font:inherit;font-size:14px;font-weight:600;color:#0D4A57;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-bottom:1.5px dotted #0D4A57;margin-bottom:8px\">Más detalle sobre este punto<span aria-hidden=\"true\" style=\"font-size:11px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ deep.d2.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:8px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Ventajas y riesgos de la fórmula<\u002Fspan>\n            <p style=\"margin:0 0 8px;font-size:14px;color:#3D4E52;line-height:1.65\"><strong>A favor:<\u002Fstrong> transparencia y objetividad, equidad horizontal y vertical simultáneas, bajo costo administrativo de asignación, predictibilidad (reforzada al estar en ley) y resistencia a la captura política.<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\"><strong>Riesgos:<\u002Fstrong> diferencias de costo no capturadas por la fórmula, incentivo a la sobreclasificación de estudiantes en categorías elegibles, y alta exigencia sobre los sistemas de información (OCDE, 2021).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <h2 id=\"dis-usos\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Usos permitidos y autonomía progresiva<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">A diferencia de la subvención general —de uso educativo amplio—, los recursos SEP son un <em>earmarked grant<\u002Fem>: se destinan a las cuatro áreas del <button sc-camel-on-click=\"{{ deep.d3.toggle }}\" aria-expanded=\"{{ deep.d3.open }}\" style=\"border:none;background:none;padding:0;font:inherit;border-bottom:1.5px dotted #0D4A57;cursor:pointer;font-weight:600;color:#0D4A57\">Plan de Mejoramiento Educativo (PME)<span aria-hidden=\"true\" style=\"font-size:11px;margin-left:3px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton> y no pueden usarse en remuneraciones de la nómina regular.<\u002Fp>\n      <sc-if value=\"{{ deep.d3.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:4px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Detalle · el PME como llave de acceso<\u002Fspan>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\">Formular y ejecutar el PME es requisito para acceder al financiamiento adicional. Las escuelas con bajos resultados deben elaborarlo e implementarlo bajo mayor supervisión, mientras las de buenos resultados pueden usar los recursos con más autonomía. El BID identifica este diseño como un ejemplo de <strong>autonomía progresiva basada en desempeño<\u002Fstrong>, recomendable cuando las capacidades locales son heterogéneas (Elacqua et al., 2025).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <h2 id=\"dis-info\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Sistemas de información y rendición de cuentas<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La elegibilidad se determina con datos administrativos del Registro Social de Hogares, no con reportes de la propia escuela, lo que reduce el riesgo de manipulación. Los sostenedores rinden cuenta del uso de los recursos ante la Superintendencia de Educación.<\u002Fp>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La contracara está documentada: la multiplicación de subvenciones y reportes genera carga administrativa y, en casos extremos, parálisis por temor a sanciones.<\u002Fp>\n\n      <div style=\"display:flex;justify-content:flex-end;margin:48px 0 0;padding-top:24px;border-top:1px solid #DCE3E1\" data-noprint=\"\">\n        <button sc-camel-on-click=\"{{ goNext }}\" style=\"font-family:'Google Sans',sans-serif;background:none;color:#0D4A57;border:1.5px solid #0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">{{ nextLabel }}\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isImplementacion }}\">\n    <article>\n      <div style=\"display:flex;align-items:flex-start;gap:12px;background:#EEF6E2;border-radius:16px;padding:16px 20px;margin:0 0 40px\" data-noprint=\"\">\n        <span aria-hidden=\"true\" style=\"font-size:16px;line-height:1.4;color:#6FA030\">⊕<\u002Fspan>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#6FA030;font-weight:500\">Los textos con <strong>línea punteada<\u002Fstrong> y los enlaces <strong>“Más detalle sobre este punto”<\u002Fstrong> se abren con un clic para ver la evidencia. Vuelve a hacer clic para cerrarlos.<\u002Fp>\n      <\u002Fdiv>\n\n      <h2 id=\"imp-legal\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:0 0 20px;scroll-margin-top:100px\">Marco legal e institucional<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La reforma se instaló por ley —Ley N°20.248 de 2008— que define quién es alumno prioritario, cómo se calcula el monto, en qué puede gastarse y cómo se rinde cuenta. Que estos elementos estén en un instrumento legal permanente es, según la experiencia internacional, la principal fuente de estabilidad y predictibilidad del financiamiento.<\u002Fp>\n      <button sc-camel-on-click=\"{{ deep.i1.toggle }}\" aria-expanded=\"{{ deep.i1.open }}\" style=\"border:none;background:none;padding:0;font:inherit;font-size:14px;font-weight:600;color:#0D4A57;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-bottom:1.5px dotted #0D4A57;margin-bottom:8px\">Más detalle sobre este punto<span aria-hidden=\"true\" style=\"font-size:11px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ deep.i1.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:8px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Dos extremos comparados<\u002Fspan>\n            <p style=\"margin:0 0 8px;font-size:14px;color:#3D4E52;line-height:1.65\"><strong>Máxima protección:<\u002Fstrong> Brasil llevó el FUNDEB a la Constitución en 2020 (Enmienda 108), convirtiéndolo en fondo permanente con complementación federal creciente.<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\"><strong>Mínima protección:<\u002Fstrong> en Ecuador la distribución general es discrecional y se basa en criterios históricos, lo que expone al sistema a los vaivenes de la prioridad política y del ciclo económico.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <h2 id=\"imp-capacidad\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Capacidad técnica de los ejecutores<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">El cuello de botella de la implementación no fue la transferencia, sino la capacidad de las escuelas y sostenedores para planificar, ejecutar y rendir. Gestionar recursos adicionales exige tiempo, capacidad administrativa y liderazgo estratégico; donde esas condiciones faltaron, los resultados de programas focalizados son mixtos.<\u002Fp>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">Chile enfrentó la fragmentación de la administración municipal creando <strong>Servicios Locales de Educación Pública<\u002Fstrong>, con una escala mayor que el municipio, una de las respuestas que la OCDE documenta para este problema.<\u002Fp>\n\n      <h2 id=\"imp-ajustes\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Ajustes durante la ejecución<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La SEP no se aplicó una vez y quedó fija: fue expandida y modificada en varias oportunidades. Las dos reformas mayores fueron la <button sc-camel-on-click=\"{{ deep.i2.toggle }}\" aria-expanded=\"{{ deep.i2.open }}\" style=\"border:none;background:none;padding:0;font:inherit;border-bottom:1.5px dotted #0D4A57;cursor:pointer;font-weight:600;color:#0D4A57\">Ley N°20.550 (2011)<span aria-hidden=\"true\" style=\"font-size:11px;margin-left:3px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton>, junto al nuevo sistema de aseguramiento de la calidad, y la Ley de Inclusión N°20.845 (2015).<\u002Fp>\n      <sc-if value=\"{{ deep.i2.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:4px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Detalle<\u002Fspan>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\">Las modificaciones ampliaron la cobertura de la subvención —incorporando la categoría de alumnos preferentes—, ajustaron montos y ordenaron la relación entre los recursos y el sistema de aseguramiento de la calidad, que clasifica escuelas y define grados de acompañamiento y supervisión.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <h2 id=\"imp-monitoreo\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Monitoreo<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">El seguimiento combina rendición financiera ante la Superintendencia de Educación con evaluación de resultados vía pruebas estandarizadas nacionales (SIMCE) e internacionales (PISA), lo que permitió estudiar el efecto de la política y ajustar su diseño.<\u002Fp>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">Es un contraste explícito con casos donde el debilitamiento de la información pública sobre resultados dificultó impulsar reformas basadas en evidencia.<\u002Fp>\n\n      <div style=\"display:flex;justify-content:flex-end;margin:48px 0 0;padding-top:24px;border-top:1px solid #DCE3E1\" data-noprint=\"\">\n        <button sc-camel-on-click=\"{{ goNext }}\" style=\"font-family:'Google Sans',sans-serif;background:none;color:#0D4A57;border:1.5px solid #0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">{{ nextLabel }}\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLecciones }}\">\n    <article>\n      <div style=\"display:flex;align-items:flex-start;gap:12px;background:#EEF6E2;border-radius:16px;padding:16px 20px;margin:0 0 40px\" data-noprint=\"\">\n        <span aria-hidden=\"true\" style=\"font-size:16px;line-height:1.4;color:#6FA030\">⊕<\u002Fspan>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#6FA030;font-weight:500\">Los textos con <strong>línea punteada<\u002Fstrong> y los enlaces <strong>“Más detalle sobre este punto”<\u002Fstrong> se abren con un clic para ver la evidencia. Vuelve a hacer clic para cerrarlos.<\u002Fp>\n      <\u002Fdiv>\n\n      <h2 id=\"lec-factores\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:0 0 20px;scroll-margin-top:100px\">Factores críticos de éxito<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 24px\">El financiamiento progresivo es condición necesaria pero no suficiente. La evidencia identifica cinco condiciones habilitantes que deben acompañarlo:<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:24px\">\n        <sc-for list=\"{{ enablers }}\" as=\"e\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:14px;align-items:flex-start;border:1px solid #DCE3E1;border-radius:12px;padding:16px 18px\">\n            <span style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:13px;color:#8BC53F;flex-shrink:0;width:22px\">{{ e.n }}<\u002Fspan>\n            <div>\n              <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:14.5px;color:#17242A;margin-bottom:4px\">{{ e.title }}<\u002Fdiv>\n              <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">{{ e.desc }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h2 id=\"lec-sostenibilidad\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Sostenibilidad<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.75;color:#33444A;margin:0 0 20px\">La SEP sobrevivió a varios ciclos políticos porque su regla de asignación está en la ley y porque amplió recursos sin quitarlos a nadie. La otra cara: fijar metas de gasto no basta por sí solo —<button sc-camel-on-click=\"{{ deep.l1.toggle }}\" aria-expanded=\"{{ deep.l1.open }}\" style=\"border:none;background:none;padding:0;font:inherit;border-bottom:1.5px dotted #0D4A57;cursor:pointer;font-weight:600;color:#0D4A57\">ocho países de la región fijaron metas y ninguno las alcanzó<span aria-hidden=\"true\" style=\"font-size:11px;margin-left:3px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton> a diez años de implementarlas.<\u002Fp>\n      <sc-if value=\"{{ deep.l1.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:4px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Detalle · cómo blindar los recursos<\u002Fspan>\n            <p style=\"margin:0 0 8px;font-size:14px;color:#3D4E52;line-height:1.65\">Movilizar recursos adicionales con destino específico es más efectivo que la meta declarativa: el Seguro Educativo de Panamá (impuesto a la renta del trabajo) y el Salário Educação de Brasil (impuesto sobre la nómina privada) financian directamente la educación pública.<\u002Fp>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\">CEPAL y UNICEF recomiendan además presupuestos plurianuales, que vinculan el financiamiento a compromisos y resultados de mediano plazo.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <h2 id=\"lec-transfer\" style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(22px,2.5vw,26px);color:#0D4A57;margin:56px 0 20px;scroll-margin-top:100px\">Transferibilidad a otros sistemas<\u002Fh2>\n      <ul style=\"padding-left:22px;margin:0 0 20px;display:flex;flex-direction:column;gap:10px\">\n        <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\"><strong>Combinar, no reemplazar:<\u002Fstrong> la recomendación es equilibrar el WSF con fondos focalizados para necesidades específicas (educación especial, ruralidad, pueblos indígenas) y con fondos compensatorios entre jurisdicciones.<\u002Fli>\n        <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\"><strong>Cuidar el exceso de fondos focalizados:<\u002Fstrong> multiplica costos de transacción, reduce transparencia y predictibilidad, y puede recentralizar el financiamiento de forma fragmentada.<\u002Fli>\n        <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\"><strong>Autonomía por desempeño:<\u002Fstrong> en contextos con capacidades desiguales conviene partir más centralizado y liberar autonomía a medida que se demuestra capacidad técnica.<\u002Fli>\n        <li style=\"font-size:15.5px;line-height:1.7;color:#33444A\"><strong>Redistribuir también dentro de los territorios:<\u002Fstrong> las fórmulas progresivas deben corregir desigualdades entre regiones y al interior de ellas; si no, los recursos locales vuelven a concentrarse.<\u002Fli>\n      <\u002Ful>\n      <button sc-camel-on-click=\"{{ deep.l2.toggle }}\" aria-expanded=\"{{ deep.l2.open }}\" style=\"border:none;background:none;padding:0;font:inherit;font-size:14px;font-weight:600;color:#0D4A57;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-bottom:1.5px dotted #0D4A57;margin-bottom:8px\">Más detalle sobre este punto<span aria-hidden=\"true\" style=\"font-size:11px;color:#6FA030\">⊕<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ deep.l2.open }}\">\n        <div style=\"background:#F4F7F6;border-radius:10px;border-left:3px solid #8BC53F;margin:8px 0 24px;animation:fadeUp .3s ease-out both\">\n          <div style=\"padding:18px 22px\">\n            <span style=\"display:block;font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Progresividad comparada en la región<\u002Fspan>\n            <p style=\"margin:0;font-size:14px;color:#3D4E52;line-height:1.65\">Chile aparece como consistentemente progresivo, incluso a nivel de estudiante; Perú pasó de regresivo a progresivo vía incentivos docentes en zonas rurales; Colombia se volvió más regresivo; Brasil mantiene una brecha amplia que se reduce lentamente; y Argentina permanece regresiva (Bertoni et al., 2020 y 2023; Elacqua et al., 2020).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;justify-content:flex-end;margin:48px 0 0;padding-top:24px;border-top:1px solid #DCE3E1\" data-noprint=\"\">\n        <button sc-camel-on-click=\"{{ goNext }}\" style=\"font-family:'Google Sans',sans-serif;background:none;color:#0D4A57;border:1.5px solid #0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">{{ nextLabel }}\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isResumen }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;margin-bottom:24px\">\n      <div style=\"background:#0D4A57;border-radius:16px;padding:clamp(26px,3vw,36px);color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:24px\">\n        <div>\n          <div style=\"font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8BC53F;margin-bottom:12px\">El caso en una mirada<\u002Fdiv>\n          <p style=\"font-family:'Google Sans',sans-serif;font-size:clamp(18px,2.1vw,23px);line-height:1.4;font-weight:400;margin:0;text-wrap:pretty\">Chile pagaba lo mismo por cada estudiante. Desde 2008 paga más por los que cuesta más educar, y condiciona ese dinero a un plan de mejora en la escuela.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <span style=\"font-family:'Google Sans',sans-serif;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35)\">Equidad vertical<\u002Fspan>\n          <span style=\"font-family:'Google Sans',sans-serif;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35)\">Fórmula por alumno<\u002Fspan>\n          <span style=\"font-family:'Google Sans',sans-serif;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35)\">Uso condicionado<\u002Fspan>\n          <span style=\"font-family:'Google Sans',sans-serif;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35)\">Respaldo en ley<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:16px;overflow:hidden;min-height:260px\">\n        <img src=\"f2034291-71b5-42f2-877f-4af05fbdc9cb\" alt=\"Estudiantes de educación básica en una sala de clases\" style=\"width:100%;height:100%;object-fit:cover\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px\">\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:20px 24px 22px;border-top:4px solid #0D4A57\">\n        <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(28px,3.2vw,34px);color:#0D4A57;line-height:1;margin-bottom:8px\">2008<\u002Fdiv>\n        <div style=\"font-family:'Google Sans',sans-serif;font-size:12.5px;font-weight:500;color:#516268;line-height:1.45\">Ley N°20.248 crea la subvención preferencial<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:20px 24px 22px;border-top:4px solid #6C90A3\">\n        <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(28px,3.2vw,34px);color:#5B7F92;line-height:1;margin-bottom:8px\">1/3<\u002Fdiv>\n        <div style=\"font-family:'Google Sans',sans-serif;font-size:12.5px;font-weight:500;color:#516268;line-height:1.45\">más vulnerable focalizado individualmente<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:20px 24px 22px;border-top:4px solid #E8A33D\">\n        <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(28px,3.2vw,34px);color:#B4791F;line-height:1;margin-bottom:8px\">50–70%<\u002Fdiv>\n        <div style=\"font-family:'Google Sans',sans-serif;font-size:12.5px;font-weight:500;color:#516268;line-height:1.45\">de subvención adicional por alumno prioritario<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:20px 24px 22px;border-top:4px solid #C4674A\">\n        <div style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:clamp(28px,3.2vw,34px);color:#B0563A;line-height:1;margin-bottom:8px\">4<\u002Fdiv>\n        <div style=\"font-family:'Google Sans',sans-serif;font-size:12.5px;font-weight:500;color:#516268;line-height:1.45\">áreas de uso definidas en el plan de mejoramiento<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#F4F7F6;border-radius:16px;padding:clamp(28px,3.4vw,44px) clamp(24px,3.6vw,48px);margin-bottom:24px\">\n      <div style=\"font-family:'Google Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#6FA030;margin-bottom:6px\">El caso en cifras<\u002Fdiv>\n      <h3 style=\"font-family:'Google Sans',sans-serif;font-weight:400;font-size:clamp(21px,2.4vw,26px);color:#0D4A57;margin:0 0 6px\">Tablero de datos del caso<\u002Fh3>\n      <p style=\"font-size:13px;color:#8CA0A5;margin:0 0 32px\">Las series de los gráficos son ilustrativas, para mostrar el comportamiento del tablero.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr;gap:20px;margin-top:28px\">\n        <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:16px;padding:26px 26px 18px\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px\">\n            <h4 style=\"font-family:'Google Sans',sans-serif;font-size:13px;font-weight:700;color:#17242A;margin:0;line-height:1.4\">Brecha de puntaje en lectura entre escuelas de alta y baja concentración de alumnos prioritarios (puntos) · serie ilustrativa<\u002Fh4>\n            <button sc-camel-on-click=\"{{ openLine }}\" aria-label=\"Ver datos y exportar el gráfico de brecha de puntaje\" style=\"display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid #DCE3E1;background:#fff;cursor:pointer;flex-shrink:0;color:#0D4A57;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\" data-noprint=\"\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3v12\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"4\" y1=\"20\" x2=\"20\" y2=\"20\"><\u002Fline><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"position:relative\">\n            <svg sc-camel-view-box=\"0 0 640 200\" width=\"100%\" height=\"190\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"La brecha desciende de 42 a 28 puntos entre 2008 y 2023\" sc-camel-on-mouse-leave=\"{{ clearTip }}\">\n              <line x1=\"40\" y1=\"30\" x2=\"620\" y2=\"30\" stroke=\"#F0F4F3\" stroke-width=\"1\"><\u002Fline>\n              <line x1=\"40\" y1=\"95\" x2=\"620\" y2=\"95\" stroke=\"#F0F4F3\" stroke-width=\"1\"><\u002Fline>\n              <line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"160\" stroke=\"#DCE3E1\" stroke-width=\"1\"><\u002Fline>\n              <line x1=\"40\" y1=\"160\" x2=\"620\" y2=\"160\" stroke=\"#DCE3E1\" stroke-width=\"1\"><\u002Fline>\n              <polyline points=\"80,98 200,110 320,118 440,129 560,138\" fill=\"none\" stroke=\"#0D4A57\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"900\" style=\"animation:drawLine 1.4s .1s ease-out both\"><\u002Fpolyline>\n              <text x=\"80\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2008<\u002Ftext>\n              <text x=\"200\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2012<\u002Ftext>\n              <text x=\"320\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2016<\u002Ftext>\n              <text x=\"440\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2019<\u002Ftext>\n              <text x=\"560\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2023<\u002Ftext>\n              <text x=\"80\" y=\"88\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0D4A57\" font-family=\"Google Sans\" font-weight=\"700\">42 pts<\u002Ftext>\n              <text x=\"560\" y=\"152\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6FA030\" font-family=\"Google Sans\" font-weight=\"700\">28 pts<\u002Ftext>\n              <sc-for list=\"{{ linePoints }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <circle cx=\"{{ p.cx }}\" cy=\"{{ p.cy }}\" r=\"{{ p.r }}\" fill=\"{{ p.fill }}\" stroke=\"#fff\" stroke-width=\"2\" style=\"animation:popDot .35s both;animation-delay:{{ p.delay }}\"><\u002Fcircle>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ linePoints }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <rect x=\"{{ p.hitX }}\" y=\"14\" width=\"60\" height=\"150\" fill=\"transparent\" style=\"cursor:pointer\" sc-camel-on-mouse-enter=\"{{ p.enter }}\" sc-camel-on-focus=\"{{ p.enter }}\" sc-camel-on-blur=\"{{ clearTip }}\" tabindex=\"0\" role=\"img\" aria-label=\"{{ p.aria }}\"><\u002Frect>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <sc-if value=\"{{ tip }}\">\n              <div aria-hidden=\"true\" style=\"position:absolute;pointer-events:none;left:{{ tip.left }};top:{{ tip.top }};transform:translate(-50%,-115%);background:#17242A;color:#fff;font-family:'Google Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 14px rgba(23,36,42,.25)\">{{ tip.text }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:16px;padding:26px 26px 18px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px\">\n              <h4 style=\"font-family:'Google Sans',sans-serif;font-size:13px;font-weight:700;color:#17242A;margin:0\">Escuelas con convenio SEP y PME vigente (miles) · ilustrativo<\u002Fh4>\n              <button sc-camel-on-click=\"{{ openBar }}\" aria-label=\"Ver datos y exportar el gráfico de escuelas con convenio\" style=\"display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid #DCE3E1;background:#fff;cursor:pointer;flex-shrink:0;color:#0D4A57;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\" data-noprint=\"\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3v12\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"4\" y1=\"20\" x2=\"20\" y2=\"20\"><\u002Fline><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"position:relative\">\n              <svg sc-camel-view-box=\"0 0 300 190\" width=\"100%\" height=\"170\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"Escuelas con convenio: de 5,2 mil en 2008 a 9,1 mil en 2023\" sc-camel-on-mouse-leave=\"{{ clearTip }}\">\n                <line x1=\"30\" y1=\"150\" x2=\"290\" y2=\"150\" stroke=\"#DCE3E1\" stroke-width=\"1\"><\u002Fline>\n                <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                  <rect x=\"{{ b.x }}\" y=\"{{ b.y }}\" width=\"30\" height=\"{{ b.h }}\" fill=\"{{ b.fill }}\" rx=\"3\" style=\"transform-origin:center bottom;animation:growBar .6s cubic-bezier(.3,1.1,.4,1) both;animation-delay:{{ b.delay }};transition:fill .15s\"><\u002Frect>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                  <rect x=\"{{ b.hitX }}\" y=\"20\" width=\"50\" height=\"130\" fill=\"transparent\" style=\"cursor:pointer\" sc-camel-on-mouse-enter=\"{{ b.enter }}\" sc-camel-on-focus=\"{{ b.enter }}\" sc-camel-on-blur=\"{{ clearTip }}\" tabindex=\"0\" role=\"img\" aria-label=\"{{ b.aria }}\"><\u002Frect>\n                <\u002Fsc-for>\n                <text x=\"50\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2008<\u002Ftext>\n                <text x=\"105\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2012<\u002Ftext>\n                <text x=\"160\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2016<\u002Ftext>\n                <text x=\"215\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2019<\u002Ftext>\n                <text x=\"270\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7C8B8D\" font-family=\"Google Sans\">2023<\u002Ftext>\n                <text x=\"270\" y=\"24\" text-anchor=\"middle\" font-size=\"11\" fill=\"#0D4A57\" font-family=\"Google Sans\" font-weight=\"700\">9,1<\u002Ftext>\n              <\u002Fsvg>\n              <sc-if value=\"{{ barTip }}\">\n                <div aria-hidden=\"true\" style=\"position:absolute;pointer-events:none;left:{{ barTip.left }};top:{{ barTip.top }};transform:translate(-50%,-115%);background:#17242A;color:#fff;font-family:'Google Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 14px rgba(23,36,42,.25)\">{{ barTip.text }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:16px;padding:26px 26px 18px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px\">\n              <h4 style=\"font-family:'Google Sans',sans-serif;font-size:13px;font-weight:700;color:#17242A;margin:0\">Matrícula por categoría de elegibilidad · ilustrativo<\u002Fh4>\n              <button sc-camel-on-click=\"{{ openPie }}\" aria-label=\"Ver datos y exportar el gráfico de matrícula por categoría\" style=\"display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid #DCE3E1;background:#fff;cursor:pointer;flex-shrink:0;color:#0D4A57;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\" data-noprint=\"\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3v12\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"4\" y1=\"20\" x2=\"20\" y2=\"20\"><\u002Fline><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n              <div style=\"position:relative;width:140px;height:150px;flex-shrink:0\">\n                <svg sc-camel-view-box=\"0 0 150 150\" width=\"140\" height=\"150\" role=\"img\" aria-label=\"Prioritarios 43%, preferentes 22%, resto 35%\" sc-camel-on-mouse-leave=\"{{ clearTip }}\">\n                  <g transform=\"translate(75,75) rotate(-90)\">\n                    <sc-for list=\"{{ arcs }}\" as=\"a\" hint-placeholder-count=\"3\">\n                      <circle r=\"52\" fill=\"none\" stroke=\"{{ a.stroke }}\" stroke-width=\"{{ a.width }}\" stroke-dasharray=\"{{ a.dash }}\" stroke-dashoffset=\"{{ a.offset }}\" style=\"cursor:pointer;transition:stroke-width .18s;animation:drawArc .9s ease-out both;animation-delay:{{ a.delay }}\" sc-camel-on-mouse-enter=\"{{ a.enter }}\" sc-camel-on-focus=\"{{ a.enter }}\" sc-camel-on-blur=\"{{ clearTip }}\" tabindex=\"0\" role=\"img\" aria-label=\"{{ a.aria }}\"><\u002Fcircle>\n                    <\u002Fsc-for>\n                  <\u002Fg>\n                <\u002Fsvg>\n                <div aria-hidden=\"true\" style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center\">\n                  <span style=\"font-family:'Google Sans',sans-serif;font-size:20px;font-weight:700;color:#0D4A57;line-height:1.1\">{{ pieBigLabel }}<\u002Fspan>\n                  <span style=\"font-family:'Google Sans',sans-serif;font-size:10px;color:#7C8B8D;margin-top:2px\">{{ pieSubLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-family:'Google Sans',sans-serif;font-size:11.5px;color:#33444A\">\n                <sc-for list=\"{{ arcs }}\" as=\"a\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:8px;opacity:{{ a.legendOpacity }}\"><span style=\"width:9px;height:9px;background:{{ a.stroke }};border-radius:2px;flex-shrink:0\"><\u002Fspan>{{ a.legend }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-bottom:24px\">\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:clamp(24px,2.6vw,30px)\">\n        <h3 style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin:0 0 18px\">Ficha técnica del mecanismo<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ ficha }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #F0F4F3\">\n              <span style=\"font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8CA0A5;line-height:1.4\">{{ f.dim }}<\u002Fspan>\n              <span style=\"font-size:13.5px;line-height:1.55;color:#33444A\">{{ f.val }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <h3 style=\"font-family:'Google Sans',sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin:0\">Evidencia clave<\u002Fh3>\n        <sc-for list=\"{{ evidence }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"border-radius:16px;padding:20px 22px;background:{{ e.bg }}\">\n            <div style=\"font-family:'Google Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:{{ e.color }};margin-bottom:8px\">{{ e.tag }}<\u002Fdiv>\n            <p style=\"margin:0 0 10px;font-size:14px;line-height:1.6;color:#33444A\">{{ e.text }}<\u002Fp>\n            <div style=\"font-family:'Google Sans',sans-serif;font-size:11.5px;font-weight:600;color:#7C8B8D\">{{ e.src }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px dashed #DCE3E1;border-radius:16px;padding:24px 28px;flex-wrap:wrap\" data-noprint=\"\">\n      <p style=\"font-family:'Google Sans',sans-serif;font-size:16px;color:#0D4A57;margin:0\">El análisis completo sigue el marco de SUMMA: contexto, diseño, implementación, resultados y lecciones.<\u002Fp>\n      <button sc-camel-on-click=\"{{ goContexto }}\" style=\"font-family:'Google Sans',sans-serif;background:#0D4A57;color:#fff;border:1.5px solid #0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s\" style-hover=\"background:#fff;color:#0D4A57\">EMPEZAR POR CONTEXTO\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isResultados }}\">\n  <div>\n    <div style=\"max-width:700px;margin:0 auto\">\n      <article>\n        <div style=\"display:flex;align-items:flex-start;gap:12px;background:#EEF6E2;border-radius:16px;padding:16px 20px;margin:0 0 40px\" data-noprint=\"\
