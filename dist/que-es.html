document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

><\/animate>\n            <animate attributeName=\"opacity\" values=\".7;0;.7\" dur=\"3.4s\" repeatCount=\"indefinite\"><\/animate>\n          <\/circle>\n          <circle cx=\"250\" cy=\"206\" r=\"6\" fill=\"#D4FBA1\"><\/circle>\n        <\/svg>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <section style=\"margin:0 0 clamp(70px,8vw,100px)\">\n    <div style=\"background:#F4F7F6;border:1px solid #DCE3E1;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,56px);padding:clamp(16px,2vw,26px) clamp(36px,6vw,80px);flex-wrap:wrap\">\n      <p style=\"font-family:Lato,sans-serif;font-size:14px;font-weight:500;color:#516268;white-space:nowrap;margin:0;letter-spacing:.01em\">Proyecto desarrollado con financiamiento de:<\/p>\n      <div aria-hidden=\"true\" style=\"width:1px;height:60px;background:#DCE3E1;flex-shrink:0\"><\/div>\n      <img src=\"assets/logo-gpe-kix.png\" alt=\"GPE KIX — Knowledge Innovation Exchange\" style=\"height:72px;width:auto;display:block\">\n    <\/div>\n  <\/section>\n\n  <section id=\"conoce\" style=\"margin:0 0 clamp(70px,8vw,100px)\">\n    <div style=\"margin:0 0 24px\">\n      <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Conoce la plataforma<\/div>\n      <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.25;color:#0D4A57;margin:0;max-width:640px;text-wrap:pretty\">Qué permite, cómo se construyó y para quiénes<\/h2>\n    <\/div>\n    <div data-m=\"accordion\" style=\"border:1px solid #DCE3E1;border-radius:16px;overflow:hidden;background:#fff\">\n      <div style=\"border-bottom:1px solid #DCE3E1;border-left:4px solid #8BC53F\">\n        <button type=\"button\" id=\"acc-permite-btn\" aria-expanded=\"{{ acc.permite.expanded }}\" aria-controls=\"acc-permite\" onClick=\"{{ acc.permite.toggle }}\" style=\"width:100%;display:flex;align-items:center;gap:clamp(14px,2vw,22px);padding:clamp(20px,2.4vw,26px) clamp(20px,2.6vw,30px);background:none;border:none;cursor:pointer;text-align:left;transition:background .15s\" style-hover=\"background:#F4F7F6\">\n          <span style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8CA0A5;flex-shrink:0\">01<\/span>\n          <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:700;font-size:clamp(17px,1.9vw,20px);color:#0D4A57;line-height:1.3\">¿Qué te permite hacer la plataforma?<\/span>\n            <span style=\"font-size:13.5px;line-height:1.5;color:#516268\">Comprender, conocer, comparar y explorar reformas educativas.<\/span>\n          <\/span>\n          <span aria-hidden=\"true\" style=\"width:38px;height:38px;border-radius:50%;border:1.5px solid #DCE3E1;display:flex;align-items:center;justify-content:center;color:#0D4A57;flex-shrink:0;transition:transform .25s ease,background .2s;transform:rotate({{ acc.permite.rot }});background:{{ acc.permite.bg }}\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><polyline points=\"6 9 12 15 18 9\"><\/polyline><\/svg><\/span>\n        <\/button>\n        <div id=\"acc-permite\" role=\"region\" aria-labelledby=\"acc-permite-btn\" style=\"display:{{ acc.permite.display }};padding:6px clamp(20px,2.6vw,30px) clamp(24px,3vw,34px);animation:fadeUp .3s ease\">\n    <div data-m=\"plat-pillars\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px\">\n      <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:20px 22px;border-left:4px solid {{ p.accent }}\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:14.5px;color:#17242A;margin-bottom:5px\">{{ p.title }}<\/div>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">{{ p.desc }}<\/p>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"border-bottom:1px solid #DCE3E1;border-left:4px solid #3E7F90\">\n        <button type=\"button\" id=\"acc-construyo-btn\" aria-expanded=\"{{ acc.construyo.expanded }}\" aria-controls=\"acc-construyo\" onClick=\"{{ acc.construyo.toggle }}\" style=\"width:100%;display:flex;align-items:center;gap:clamp(14px,2vw,22px);padding:clamp(20px,2.4vw,26px) clamp(20px,2.6vw,30px);background:none;border:none;cursor:pointer;text-align:left;transition:background .15s\" style-hover=\"background:#F4F7F6\">\n          <span style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8CA0A5;flex-shrink:0\">02<\/span>\n          <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:700;font-size:clamp(17px,1.9vw,20px);color:#0D4A57;line-height:1.3\">¿Cómo se construyó la plataforma?<\/span>\n            <span style=\"font-size:13.5px;line-height:1.5;color:#516268\">Consulta con los países, criterios explícitos y validación de un comité de expertos.<\/span>\n          <\/span>\n          <span aria-hidden=\"true\" style=\"width:38px;height:38px;border-radius:50%;border:1.5px solid #DCE3E1;display:flex;align-items:center;justify-content:center;color:#0D4A57;flex-shrink:0;transition:transform .25s ease,background .2s;transform:rotate({{ acc.construyo.rot }});background:{{ acc.construyo.bg }}\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><polyline points=\"6 9 12 15 18 9\"><\/polyline><\/svg><\/span>\n        <\/button>\n        <div id=\"acc-construyo\" role=\"region\" aria-labelledby=\"acc-construyo-btn\" style=\"display:{{ acc.construyo.display }};padding:6px clamp(20px,2.6vw,30px) clamp(24px,3vw,34px);animation:fadeUp .3s ease\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(20px,3vw,32px)\">\n      <div style=\"border-top:3px solid #8BC53F;padding-top:18px\">\n        <svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8BC53F\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:12px;display:block\" aria-hidden=\"true\">\n          <circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle>\n          <line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"><\/line>\n          <path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"><\/path>\n        <\/svg>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:13px;color:#6FA030;margin-bottom:10px\">01<\/div>\n        <p style=\"font-size:14.5px;line-height:1.7;color:#516268;margin:0\">Las temáticas prioritarias se definen en consulta con los países de la región. A partir de ellas, equipos de especialistas desarrollan cada área de reforma, elaboran su marco teórico, identifican casos y analizan la evidencia disponible.<\/p>\n      <\/div>\n      <div style=\"border-top:3px solid #3E7F90;padding-top:18px\">\n        <svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3E7F90\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:12px;display:block\" aria-hidden=\"true\">\n          <polyline points=\"9 11 12 14 22 4\"><\/polyline>\n          <path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\/path>\n        <\/svg>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:13px;color:#3E7F90;margin-bottom:10px\">02<\/div>\n        <p style=\"font-size:14.5px;line-height:1.7;color:#516268;margin:0\">Los criterios para seleccionar los casos se definen en conjunto con SUMMA, considerando la solidez de la evidencia y la relevancia de cada experiencia para los desafíos educativos de la región. La plataforma hace explícitos estos criterios y permite consultar cómo se aplicaron a cada caso.<\/p>\n      <\/div>\n      <div style=\"border-top:3px solid #0D4A57;padding-top:18px\">\n        <svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0D4A57\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:12px;display:block\" aria-hidden=\"true\">\n          <path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\/path>\n          <circle cx=\"9\" cy=\"7\" r=\"4\"><\/circle>\n          <path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"><\/path>\n          <path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\/path>\n        <\/svg>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:13px;color:#0D4A57;margin-bottom:10px\">03<\/div>\n        <p style=\"font-size:14.5px;line-height:1.7;color:#516268;margin:0\">Luego se reconstruyen las trayectorias y se comparan los casos para identificar aprendizajes. A lo largo del proceso, un comité de expertos revisa y valida el desarrollo de cada área, la selección de los casos y el análisis realizado.<\/p>\n      <\/div>\n    <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"border-bottom:none;border-left:4px solid #0D4A57\">\n        <button type=\"button\" id=\"acc-quienes-btn\" aria-expanded=\"{{ acc.quienes.expanded }}\" aria-controls=\"acc-quienes\" onClick=\"{{ acc.quienes.toggle }}\" style=\"width:100%;display:flex;align-items:center;gap:clamp(14px,2vw,22px);padding:clamp(20px,2.4vw,26px) clamp(20px,2.6vw,30px);background:none;border:none;cursor:pointer;text-align:left;transition:background .15s\" style-hover=\"background:#F4F7F6\">\n          <span style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;color:#8CA0A5;flex-shrink:0\">03<\/span>\n          <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:700;font-size:clamp(17px,1.9vw,20px);color:#0D4A57;line-height:1.3\">¿Para quiénes?<\/span>\n            <span style=\"font-size:13.5px;line-height:1.5;color:#516268\">Perfiles y usos de la plataforma.<\/span>\n          <\/span>\n          <span aria-hidden=\"true\" style=\"width:38px;height:38px;border-radius:50%;border:1.5px solid #DCE3E1;display:flex;align-items:center;justify-content:center;color:#0D4A57;flex-shrink:0;transition:transform .25s ease,background .2s;transform:rotate({{ acc.quienes.rot }});background:{{ acc.quienes.bg }}\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><polyline points=\"6 9 12 15 18 9\"><\/polyline><\/svg><\/span>\n        <\/button>\n        <div id=\"acc-quienes\" role=\"region\" aria-labelledby=\"acc-quienes-btn\" style=\"display:{{ acc.quienes.display }};padding:6px clamp(20px,2.6vw,30px) clamp(24px,3vw,34px);animation:fadeUp .3s ease\">\n    <div data-m=\"audience-cards\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px\">\n      <sc-for list=\"{{ audience }}\" as=\"a\" hint-placeholder-count=\"4\">\n        <div style=\"background:#F4F7F6;border-radius:16px;padding:20px 22px\">\n          <span aria-hidden=\"true\" style=\"position:relative;display:block;width:100%;height:100px;margin:0 0 12px\">\n            <span style=\"position:absolute;inset:0;background-image:url(assets/perfil-tecnicos.png);background-size:contain;background-position:left center;background-repeat:no-repeat;opacity:{{ a.i1 }}\"><\/span>\n            <span style=\"position:absolute;inset:0;background-image:url(assets/perfil-tomadores.png);background-size:contain;background-position:left center;background-repeat:no-repeat;opacity:{{ a.i2 }}\"><\/span>\n            <span style=\"position:absolute;inset:0;background-image:url(assets/perfil-implementadores.png);background-size:contain;background-position:left center;background-repeat:no-repeat;opacity:{{ a.i3 }}\"><\/span>\n            <span style=\"position:absolute;inset:0;background-image:url(assets/perfil-investigadores.png);background-size:contain;background-position:left center;background-repeat:no-repeat;opacity:{{ a.i4 }}\"><\/span>\n            <span style=\"position:absolute;inset:0;background-image:url({{ a.photo }});background-size:cover;background-position:center 70%;border-radius:10px;opacity:{{ a.photoOp }}\"><\/span>\n          <\/span>\n          <div style=\"display:flex;align-items:baseline;gap:8px;margin-bottom:4px;min-height:2.7em\">\n            <span style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;color:#8CA0A5;flex-shrink:0\">{{ a.n }}<\/span>\n            <span style=\"font-family:Lato,sans-serif;font-weight:700;font-size:14.5px;color:#0D4A57;line-height:1.35\">{{ a.title }}<\/span>\n          <\/div>\n          <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#516268\">{{ a.desc }}<\/p>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"marco\" style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;background:#F4F7F6;border-radius:16px;padding:28px 32px;margin:0 0 clamp(52px,6.5vw,82px);flex-wrap:wrap\" data-noprint>\n    <p style=\"font-family:Lato,sans-serif;font-size:17px;color:#0D4A57;margin:0;max-width:560px\">Conoce cómo el modelo conceptual explica la mejora de los sistemas educativos y orienta el análisis de cada caso.<\/p>\n    <a href=\"marco-wise.html\" style=\"font-family:Lato,sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">VER MODELO CONCEPTUAL\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\ e({openAcc: open ? null : k}); }\n        };\n        return o;\n      }, {}),\n\n      pillars:[\n        {accent:'#0D4A57', title:'Comprender y fortalecer la mejora de los sistemas educativos', desc:'El modelo conceptual analiza cómo los sistemas complejos y multinivel transforman sus condiciones y recursos en oportunidades de aprendizaje y bienestar. También examina las relaciones, interdependencias, trayectorias y procesos de retroalimentación que intervienen en la mejora educativa.'},\n        {accent:'#8BC53F', title:'Conocer las reformas en profundidad', desc:'Los casos en profundidad combinan evidencia, indicadores, fuentes documentales y entrevistas a quienes participaron en el diseño, la conducción y la implementación de las reformas. Esta información permite reconstruir sus decisiones, actores, tensiones, procesos de implementación y resultados. Los ejemplos documentados ofrecen una aproximación más sintética y amplían la cobertura temática y geográfica de la plataforma.'},\n        {accent:'#E8A33D', title:'Comparar trayectorias y contextos', desc:'Una estructura de análisis compartida permite contrastar el contexto, el diseño, la implementación y los resultados de distintas reformas. La comparación ayuda a identificar patrones, diferencias y condiciones contextuales. Su finalidad es analítica y favorece una interpretación situada de cada experiencia.'},\n        {accent:'#6C90A3', title:'Explorar tendencias históricas de reforma', desc:'Con datos de la base WERD, la plataforma analiza qué reformas se registraron, en qué países y períodos, y en qué dimensiones se concentró la acción de política durante los años cubiertos por la base.'}\n      ],\n      audience:[\n        {n:'01', title:'Tomadores de decisión', desc:'Autoridades responsables de definir prioridades, orientar políticas y asignar recursos. La plataforma aporta evidencia y contexto para analizar alternativas e informar decisiones.', i1:0, i2:0, i3:0, i4:0, photo:'assets/foto-tomadores.png', photoOp:1},\n        {n:'02', title:'Equipos técnicos y asesores', desc:'Especialistas que diseñan opciones, elaboran recomendaciones y acompañan la toma de decisiones. Pueden analizar evidencia, capacidades, condiciones de implementación y experiencias comparadas.', i1:0, i2:0, i3:0, i4:0, photo:'assets/foto-tecnicos.png', photoOp:1},\n        {n:'03', title:'Equipos de implementación', desc:'Actores de los niveles nacional, intermedio y local que coordinan, adaptan y sostienen las reformas. La plataforma permite comprender procesos, actores, mediaciones y desafíos de implementación.', i1:0, i2:0, i3:0, i4:0, photo:'assets/foto-implementadores.png', photoOp:1},\n        {n:'04', title:'Investigadores y evaluadores', desc:'Académicos, centros de estudio y especialistas que analizan las trayectorias, los procesos y los resultados de las reformas a partir de casos, fuentes e indicadores comparables.', i1:0, i2:0, i3:0, i4:0, photo:'assets/foto-investigadores.png', photoOp:1}\n      ]\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
