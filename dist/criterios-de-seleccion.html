document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t(auto-fit,minmax(240px,1fr));gap:16px\">\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:22px 24px;border-top:4px solid #0D4A57\">\n        <div style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:8px\">Filtro 1 · Elegibilidad</div>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;line-height:1.3;margin-bottom:6px\">Vigencia, naturaleza y alcance</div>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Define qué es una reforma admisible. Si no se cumple, el caso no avanza.</p>\n      </div>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:22px 24px;border-top:4px solid #8BC53F\">\n        <div style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:8px\">Filtro 2 · Obligatorio</div>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;line-height:1.3;margin-bottom:6px\">Criterios primarios</div>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Equidad, resultados y justicia educativa: deben cumplirse para que el caso sea seleccionable.</p>\n      </div>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:22px 24px;border-top:4px solid #E8A33D\">\n        <div style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:8px\">Filtro 3 · Desempate</div>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;line-height:1.3;margin-bottom:6px\">Criterios secundarios</div>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Diferencian entre casos que ya pasaron los filtros. No excluyen: ordenan por prioridad.</p>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"matriz\" style=\"margin:0 0 clamp(52px,6.5vw,82px);scroll-margin-top:110px\">\n    <div style=\"margin-bottom:4px\">\n      <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Criterios por caso</div>\n      <h2 data-m=\"h2\" style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.25;color:#0D4A57;margin:0;max-width:560px\">Qué criterio aplica a cada reforma</h2>\n    </div>\n\n    <p data-m=\"cds-inst\" style=\"font-family:Lato,sans-serif;font-size:13.5px;color:#4F6B72;margin:20px 0 0\">Selecciona primero la línea de reforma y luego el caso.</p>\n\n    <div role=\"tablist\" aria-label=\"Línea de reforma\" data-m=\"cds-linea-tabs\" data-m2=\"scroll-x\" style=\"display:flex;gap:clamp(14px,2.2vw,28px);border-bottom:1px solid #DCE3E1;margin:22px 0 22px;flex-wrap:wrap\" data-noprint>\n      <sc-for list=\"{{ lineaTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n        <button role=\"tab\" aria-selected=\"{{ t.selected }}\" onClick=\"{{ t.select }}\" style=\"{{ t.style }}\">{{ t.label }}</button>\n      </sc-for>\n    </div>\n\n    <span data-m=\"cds-linea-intro\" style=\"display:none!important;position:absolute;visibility:hidden\">{{ lineaIntro }}</span>\n\n    <div data-m=\"cds-casos-wrap\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px\" data-noprint>\n      <span style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4F6B72\">Caso</span>\n      <div data-m=\"scroll-x\" style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ casoChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <button onClick=\"{{ c.select }}\" aria-pressed=\"{{ c.pressed }}\" style=\"{{ c.style }}\">{{ c.label }}</button>\n        </sc-for>\n      </div>\n    </div>\n\n    <div data-m=\"table-scroll\" style=\"border:1px solid #DCE3E1;border-radius:16px;overflow-x:auto;-webkit-overflow-scrolling:touch\">\n      <div role=\"table\" style=\"display:grid;grid-template-columns:210px {{ colGridTemplate }};min-width:{{ tableMin }}\">\n        <div role=\"row\" style=\"display:contents\">\n          <div role=\"columnheader\" style=\"text-align:left;font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#4F6B72;padding:20px 18px 14px 22px;border-bottom:1.5px solid #DCE3E1;width:210px;background:#fff;position:sticky;left:0;z-index:2\">Criterio</div>\n          <sc-for list=\"{{ cols }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div role=\"columnheader\" style=\"text-align:left;padding:20px 18px 14px;border-bottom:1.5px solid #DCE3E1;border-left:1px solid #F0F4F3;min-width:190px\">\n              <span style=\"display:block;font-family:Lato,sans-serif;font-size:11px;font-weight:600;color:#8CA0A5;margin-bottom:5px\">{{ c.country }}</span>\n              <a href=\"{{ c.href }}\" style=\"font-family:Lato,sans-serif;font-size:14.5px;font-weight:700;color:#0D4A57;line-height:1.3;text-decoration:none\">{{ c.title }}</a>\n            </div>\n          </sc-for>\n        </div>\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"12\">\n          <div role=\"row\" style=\"display:contents\">\n            <div role=\"rowheader\" style=\"text-align:left;padding:16px 18px 16px 22px;border-bottom:1px solid #F0F4F3;background:{{ r.rowBg }};position:sticky;left:0;z-index:1\">\n              <sc-if value=\"{{ r.isGroup }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display:block;font-family:Lato,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:{{ r.groupColor }}\">{{ r.group }}</span>\n              </sc-if>\n              <span style=\"display:block;font-family:Lato,sans-serif;font-size:13.5px;font-weight:700;color:#17242A;line-height:1.35;margin-top:{{ r.nameTop }}\">{{ r.name }}</span>\n              <button onClick=\"{{ r.toggle }}\" aria-expanded=\"{{ r.open }}\" style=\"display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-family:Lato,sans-serif;font-size:11.5px;font-weight:600;color:#4F6B72;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline\" data-noprint>{{ r.defLabel }}</button>\n              <sc-if value=\"{{ r.open }}\">\n                <span style=\"display:block;font-size:12.5px;line-height:1.55;color:#516268;margin-top:8px;padding-left:10px;border-left:2px solid #8BC53F;animation:fadeUp .24s ease-out both\">{{ r.definition }}</span>\n              </sc-if>\n            </div>\n            <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div role=\"cell\" style=\"padding:16px 18px;border-bottom:1px solid #F0F4F3;border-left:1px solid #F0F4F3;background:{{ c.bg }}\">\n                <span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Lato,sans-serif;font-size:12.5px;font-weight:700;color:{{ c.color }};background:{{ c.chipBg }};padding:5px 11px;border-radius:6px;line-height:1.3\">{{ c.value }}</span>\n                <sc-if value=\"{{ c.hasNote }}\">\n                  <span style=\"display:block;font-size:12.5px;line-height:1.55;color:#516268;margin-top:7px\">{{ c.note }}</span>\n                </sc-if>\n              </div>\n            </sc-for>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px\">\n      <p style=\"font-size:12.5px;color:#4F6B72;margin:0;max-width:560px\">Cada caso nuevo de la línea se suma como una columna más. Los criterios sin aplicación en la línea se marcan como “No aplica”.</p>\n      <button onClick=\"{{ exportCsv }}\" style=\"font-family:Lato,sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:11px 20px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap\" style-hover=\"background:#0D4A57;color:#fff\" data-noprint>EXPORTAR CSV</button>\n    </div>\n  </section>\n\n  <section style=\"margin:0 0 clamp(52px,6.5vw,82px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:clamp(22px,2.8vw,30px)\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n          <span style=\"width:26px;height:26px;border-radius:50%;background:#EEF6E2;color:#4E7220;display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg>\n          </span>\n          <h3 style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin:0\">Entra a la plataforma</h3>\n        </div>\n        <ul style=\"padding-left:20px;margin:0;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ inclusion }}\" as=\"x\" hint-placeholder-count=\"5\">\n            <li style=\"font-size:14px;line-height:1.6;color:#3D4E52\">{{ x.text }}</li>\n          </sc-for>\n        </ul>\n      </div>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:clamp(22px,2.8vw,30px)\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n          <span style=\"width:26px;height:26px;border-radius:50%;background:#F6E2DC;color:#9A4630;display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" aria-hidden=\"true\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"></line><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"></line></svg>\n          </span>\n          <h3 style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin:0\">Queda fuera</h3>\n        </div>\n        <ul style=\"padding-left:20px;margin:0;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ exclusion }}\" as=\"x\" hint-placeholder-count=\"5\">\n            <li style=\"font-size:14px;line-height:1.6;color:#3D4E52\">{{ x.text }}</li>\n          </sc-for>\n        </ul>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;background:#F4F7F6;border-radius:16px;padding:28px 32px;margin:0 0 clamp(52px,6.5vw,82px);flex-wrap:wrap\" data-noprint>\n    <p style=\"font-family:Lato,sans-serif;font-size:17px;color:#0D4A57;margin:0;max-width:560px\">Revisa los casos que pasaron este filtro y compáralos entre sí.</p>\n    <a href=\"casos.html?vista=comparador\" style=\"font-family:Lato,sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">COMPARAR CASOS\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"></line><polyline points=\"12 5 19 12 12 19\"></polyline></svg>\n    </a>\n  </section>\n\n</div>\n\n<footer style=\"background:#0D4A57;margin-top:0;padding:clamp(38px,4.4vw,54px) clamp(20px,4vw,40px) clamp(34px,4vw,46px)\">\n    <div data-m=\"footer-row\" style=\"max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:26px\">\n      <div style=\"display:flex;align-items:c l educativo',\n   def:{fin:'Niveles que cubre: preescolar, primaria inicial (1º-3º/4º), primaria completa, secundaria o todos los niveles.',\n        lec:'Niveles que cubre. Debe cubrir al menos los primeros grados de primaria, desde kínder al primer ciclo básico.'}},\n  {id:'cobertura', name:'Cobertura',\n   def:{fin:'Sistémico: aplica a todo el sistema público o a una categoría amplia y estable. Focalizado a escala significativa: segmento acotado pero con volumen relevante y sostenido. Piloto acotado: unas pocas escuelas sin escalamiento, se excluye salvo que haya escalado después.',\n        lec:'Sistémico: aplica a todo el sistema público o a una categoría amplia y estable. Focalizado a escala significativa: segmento acotado pero con volumen relevante y sostenido. Piloto acotado: unas pocas escuelas sin escalamiento, se excluye salvo que haya escalado después.'}},\n  {id:'region', name:'Región',\n   def:{fin:'LAC u otra región. Dato de registro: aún no pondera en la selección.',\n        lec:'LAC u otra región. Dato de registro: aún no pondera en la selección.'}},\n\n  {id:'e1', group:'Criterios primarios · nivel de evidencia 0-2', groupColor:'#4E7220',\n   name:{fin:'Equidad en financiamiento', lec:'Aprendizajes'},\n   def:{fin:'¿Llegó más recurso per cápita a las escuelas más vulnerables? 2 = evidencia robusta (evaluación experimental o cuasi-experimental). 1 = evidencia parcial (datos descriptivos, correlacionales o informe institucional sin diseño causal). 0 = sin evidencia.',\n        lec:'Efecto en aprendizajes de lectura y escritura. 2 = evidencia robusta (evaluación experimental o cuasi-experimental). 1 = evidencia parcial (datos descriptivos, correlacionales o informe institucional sin diseño causal). 0 = sin evidencia.'}},\n  {id:'e2', name:{fin:'Resultados educativos', lec:'Acceso y trayectorias'},\n   def:{fin:'Acceso, permanencia y aprendizajes atribuibles al mecanismo, en la misma escala de evidencia 0-2.',\n        lec:'Acceso, permanencia y traye lor:'#8A5C14', chipBg:'#FBF0DF'},\n  '0':{label:'0 · Sin evidencia', color:'#9A4630', chipBg:'#F6E2DC'}\n};\nconst EV_ROWS = ['e1','e2','e3'];\nconst POSITIVE = ['Sí','Elegible','Sistémico','Nacional','Vigente','Rediseñada','Reforma','Política'];\nconst PARTIAL = ['Parcial','Revisar','Focalizado a escala significativa','Discontinuada','Programa'];\n\nclass Component extends DCLogic {\n  state = {scrolled:false, linea:'fin', caso:CASES.filter(function(c){return c.linea==='fin';})[0].id, open:{}};\n\n  componentDidMount(){\n    this.onScroll = () => {\n      const sc = window.scrollY > 8;\n      if(sc !== this.state.scrolled) this.setState({scrolled:sc});\n    };\n    window.addEventListener('scroll', this.onScroll, {passive:true});\n    this.onScroll();\n\n    const q = new URLSearchParams(location.search);\n    const validL = LINEAS.map(function(x){ return x.id; });\n    const caso = CASES.filter(function(c){ return c.id === q.get('caso'); })[0];\n    const l = caso ? caso.linea : q.get('linea');\n    if(l && validL.indexOf(l) > -1){\n      const self = this;\n      this.setState({linea:l, caso: caso ? caso.id : 'todos'}, function(){\n        const el = document.getElementById('matriz');\n        if(el) setTimeout(function(){\n          window.scrollTo({top: el.getBoundingClientRect().top + window.pageYOffset - 100, behavior:'smooth'});\n        }, 260);\n      });\n    }\n  }\n  componentWillUnmount(){ window.removeEventListener('scroll', this.onScroll); }\n\n  renderVals(){\n    const s = this.state, self = this;\n    const linea = LINEAS.filter(function(x){ return x.id === s.linea; })[0];\n    const lineaCases = CASES.filter(function(c){ return c.linea === s.linea; });\n    const cases = s.caso === 'todos'\n      ? lineaCases\n      : lineaCases.filter(function(c){ return c.id === s.caso; });\n\n    function chip(cell, rowId){\n      if(!cell) return {label:'—', color:'#4F6B72', chipBg:'#F0F4F3'};\n      if(EV_ROWS.indexOf(rowId) > -1 && EVIDENCIA[cell.value]){\n        const e = EVIDENCIA[cell.value];\n        return {label:e.label, color:e.color, chipBg:e.chipBg};\n      }\n      const base = {label:cell.value};\n      if(cell.na || cell.neutral) return Object.assign(base, {color:'#4F6B72', chipBg:'#F0F4F3'});\n      if(POSITIVE.indexOf(cell.value) > -1) return Object.assign(base, {color:'#4E7220', chipBg:'#EEF6E2'});\n      if(PARTIAL.indexOf(cell.value) > -1) return Object.assign(base, {color:'#8A5C14', chipBg:'#FBF0DF'});\n      return Object.assign(base, {color:'#0D4A57', chipBg:'#EAF1F2'});\n    }\n\n    return {\n      navShadow: s.scrolled ? '0 4px 20px rgba(13,74,87,.09)' : 'none',\n\n      lineaTabs: LINEAS.map(function(l){\n        const on = s.linea === l.id;\n        return {\n          label:l.label, selected: on ? 'true' : 'false',\n          select:function(){ var fc=CASES.filter(function(c){return c.linea===l.id;})[0]; self.setState({linea:l.id, caso:fc?fc.id:'', open:{}}); },\n          style:\"font-family:Lato,sans-serif;font-size:clamp(14px,1.5vw,17px);font-weight:700;background:none;border:none;padding:16px 2px;cursor:pointer;transition:all .15s;border-bottom:3px solid \" +\n            (on ? '#8BC53F' : 'transparent') + ';color:' + (on ? '#0D4A57' : '#7C8B8D')\n        };\n      }),\n      casoChips: lineaCases.map(function(c){ return {id:c.id, label:c.title}; })\n      .map(function(o){\n        const on = s.caso === o.id;\n        return {\n          label:o.label, pressed: on ? 'true' : 'false',\n          select:function(){ self.setState({caso:o.id}); },\n          style:\"font-family:Lato,sans-serif;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;border:1.5px solid \" +\n            (on ? '#0D4A57;background:#0D4A57;color:#fff' : '#DCE3E1;background:#fff;color:#4F6B72')\n        };\n      }),\n      lineaIntro: linea.intro,\n      tableMin: (210 + cases.length * 215) + 'px',\n      colGridTemplate: 'repeat(' + cases.length + ',minmax(190px,1fr))',\n\n      cols: cases.map(function(c){\n        return {title:c.title, country:c.country, href:c.href};\n      }),\n\n      rows: ROWS.map(function(r, ri){\n        const open = !!s.open[r.id];\n        return {\n          name: typeof r.name === 'string' ? r.name : r.name[s.linea],\n          isGroup: !!r.group, group:r.group || '', groupColor:r.groupColor || '#8CA0A5',\n          nameTop: r.group ? '7px' : '0px',\n          rowBg: r.group ? '#FBFCFC' : '#fff',\n          open:open,\n          defLabel: open ? 'Ocultar definición' : 'Ver definición',\n          definition: r.def[s.linea],\n          toggle:function(){\n            const o = Object.assign({}, s.open); o[r.id] = !open;\n            self.setState({open:o});\n          },\n          cells: cases.map(function(c){\n            const cell = c.v[r.id] || {value:'—'};\n            const col = chip(cell, r.id);\n            return {\n              value:col.label, color:col.color, chipBg:col.chipBg,\n              bg: r.group ? '#FBFCFC' : '#fff',\n              hasNote: !!cell.note, note:cell.note || ''\n            };\n          })\n        };\n      }),\n\n      exportCsv:function(){\n        const head = ['Criterio'].concat(cases.map(function(c){ return c.title + ' (' + c.country + ')'; }));\n        const body = ROWS.map(function(r){\n          const nm = typeof r.name === 'string' ? r.name : r.name[s.linea];\n          return [nm].concat(cases.map(function(c){\n            const cell = c.v[r.id];\n            if(!cell) return '—';\n            const lbl = chip(cell, r.id).label;\n            return cell.note ? lbl + ' — ' + cell.note : lbl;\n          }));\n        });\n        const csv = [head].concat(body).map(function(row){\n          return row.map(function(v){ return '\"' + String(v).split('\"').join('\"\"') + '\"'; }).join(',');\n        }).join('\\n');\n        const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));\n        const a = document.createElement('a');\n        a.href = url; a.download = 'criterios-' + (s.caso || s.linea) + '.csv';\n        document.body.appendChild(a); a.click(); document.body.removeChild(a);\n        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);\n      },\n\n      inclusion:[\n        {text:'Reformas o políticas con al menos cinco años de vigencia, actuales, descontinuadas o rediseñadas.'},\n        {text:'Alcance nacional o subnacional estadual, con cobertura sistémica o focalizada a escala significativa.'},\n        {text:'Intervención en más de una dimensión del sistema, no en un solo componente.'},\n        {text:'Evidencia disponible de resultados educativos atribuibles al mecanismo.'},\n        {text:'Evidencia de reducción de brechas de aprendizaje entre grupos.'},\n        {text:'En financiamiento: progresividad verificable a nivel de estudiante.'}\n      ],\n      exclusion:[\n        {text:'Programas acotados o parciales que intervienen en una sola dimensión.'},\n        {text:'Reformas con menos de cinco años de vigencia.'},\n        {text:'Iniciativas de alcance local o institucional aislado.'},\n        {text:'Casos sin evidencia documentada de resultados ni de efectos distributivos.'},\n        {text:'En lectoescritura: modelos que trabajan solo el código, sin comprensión ni estrategias dialógicas.'},\n        {text:'En lectoescritura: reformas que no cubren los primeros grados de primaria.'}\n      ]\n    };\n  }\n}\n<\/script>\n</body>\n</html>\n"

    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"><\u002Fline><polyline points=\"5 12 12 19 19 12\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"margin:0 0 clamp(52px,6.5vw,82px)\">\n    <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Cómo funciona<\u002Fdiv>\n    <h2 data-m=\"h2\" style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.25;color:#0D4A57;margin:0 0 22px;max-width:620px\">Tres filtros sucesivos, aplicados en orden<\u002Fh2>\n    <div data-m=\"cds-filters\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:22px 24px;border-top:4px solid #0D4A57\">\n        <div style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:8px\">Filtro 1 · Elegibilidad<\u002Fdiv>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;line-height:1.3;margin-bottom:6px\">Vigencia, naturaleza y alcance<\u002Fdiv>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Define qué es una reforma admisible. Si no se cumple, el caso no avanza.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:22px 24px;border-top:4px solid #8BC53F\">\n        <div style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:8px\">Filtro 2 · Obligatorio<\u002Fdiv>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;line-height:1.3;margin-bottom:6px\">Criterios primarios<\u002Fdiv>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Equidad, resultados y justicia educativa: deben cumplirse para que el caso sea seleccionable.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:22px 24px;border-top:4px solid #E8A33D\">\n        <div style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8CA0A5;margin-bottom:8px\">Filtro 3 · Desempate<\u002Fdiv>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;line-height:1.3;margin-bottom:6px\">Criterios secundarios<\u002Fdiv>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Diferencian entre casos que ya pasaron los filtros. No excluyen: ordenan por prioridad.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"matriz\" style=\"margin:0 0 clamp(52px,6.5vw,82px);scroll-margin-top:110px\">\n    <div style=\"margin-bottom:4px\">\n      <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Criterios por caso<\u002Fdiv>\n      <h2 data-m=\"h2\" style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.25;color:#0D4A57;margin:0;max-width:560px\">Qué criterio aplica a cada reforma<\u002Fh2>\n    <\u002Fdiv>\n\n    <p data-m=\"cds-inst\" style=\"font-family:Lato,sans-serif;font-size:13.5px;color:#4F6B72;margin:20px 0 8px\">Selecciona primero la línea de reforma y luego el caso.</p>\n    <div role=\"tablist\" aria-label=\"Línea de reforma\" data-m=\"cds-linea-tabs\" data-m2=\"scroll-x\" style=\"display:flex;gap:clamp(14px,2.2vw,28px);border-bottom:1px solid #DCE3E1;margin:22px 0 22px;flex-wrap:wrap\" data-noprint>\n      <sc-for list=\"{{ lineaTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n        <button role=\"tab\" aria-selected=\"{{ t.selected }}\" onClick=\"{{ t.select }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p data-m=\"cds-intro\" style=\"font-size:14px;line-height:1.6;color:#516268;margin:0 0 18px;max-width:660px\">{{ lineaIntro }}<\u002Fp>\n\n    <div data-m=\"cds-casos-wrap\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px\" data-noprint>\n      <span style=\"font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4F6B72\">Caso<\u002Fspan>\n      <div data-m=\"scroll-x\" style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ casoChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <button onClick=\"{{ c.select }}\" aria-pressed=\"{{ c.pressed }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-m=\"table-scroll\" style=\"border:1px solid #DCE3E1;border-radius:16px;overflow-x:auto;-webkit-overflow-scrolling:touch\">\n      <div role=\"table\" style=\"display:grid;grid-template-columns:210px {{ colGridTemplate }};min-width:{{ tableMin }}\">\n        <div role=\"row\" style=\"display:contents\">\n          <div role=\"columnheader\" style=\"text-align:left;font-family:Lato,sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#4F6B72;padding:20px 18px 14px 22px;border-bottom:1.5px solid #DCE3E1;width:210px;background:#fff;position:sticky;left:0;z-index:2\">Criterio<\u002Fdiv>\n          <sc-for list=\"{{ cols }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div role=\"columnheader\" style=\"text-align:left;padding:20px 18px 14px;border-bottom:1.5px solid #DCE3E1;border-left:1px solid #F0F4F3;min-width:190px\">\n              <span style=\"display:block;font-family:Lato,sans-serif;font-size:11px;font-weight:600;color:#8CA0A5;margin-bottom:5px\">{{ c.country }}<\u002Fspan>\n              <a href=\"{{ c.href }}\" style=\"font-family:Lato,sans-serif;font-size:14.5px;font-weight:700;color:#0D4A57;line-height:1.3;text-decoration:none\">{{ c.title }}<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"12\">\n          <div role=\"row\" style=\"display:contents\">\n            <div role=\"rowheader\" style=\"text-align:left;padding:16px 18px 16px 22px;border-bottom:1px solid #F0F4F3;background:{{ r.rowBg }};position:sticky;left:0;z-index:1\">\n              <sc-if value=\"{{ r.isGroup }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display:block;font-family:Lato,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:{{ r.groupColor }}\">{{ r.group }}<\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"display:block;font-family:Lato,sans-serif;font-size:13.5px;font-weight:700;color:#17242A;line-height:1.35;margin-top:{{ r.nameTop }}\">{{ r.name }}<\u002Fspan>\n              <button onClick=\"{{ r.toggle }}\" aria-expanded=\"{{ r.open }}\" style=\"display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-family:Lato,sans-serif;font-size:11.5px;font-weight:600;color:#4F6B72;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline\" data-noprint>{{ r.defLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ r.open }}\">\n                <span style=\"display:block;font-size:12.5px;line-height:1.55;color:#516268;margin-top:8px;padding-left:10px;border-left:2px solid #8BC53F;animation:fadeUp .24s ease-out both\">{{ r.definition }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div role=\"cell\" style=\"padding:16px 18px;border-bottom:1px solid #F0F4F3;border-left:1px solid #F0F4F3;background:{{ c.bg }}\">\n                <span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Lato,sans-serif;font-size:12.5px;font-weight:700;color:{{ c.color }};background:{{ c.chipBg }};padding:5px 11px;border-radius:6px;line-height:1.3\">{{ c.value }}<\u002Fspan>\n                <sc-if value=\"{{ c.hasNote }}\">\n                  <span style=\"display:block;font-size:12.5px;line-height:1.55;color:#516268;margin-top:7px\">{{ c.note }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px\">\n      <p style=\"font-size:12.5px;color:#4F6B72;margin:0;max-width:560px\">Cada caso nuevo de la línea se suma como una columna más. Los criterios sin aplicación en la línea se marcan como “No aplica”.<\u002Fp>\n      <button onClick=\"{{ exportCsv }}\" style=\"font-family:Lato,sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;background:none;font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:11px 20px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap\" style-hover=\"background:#0D4A57;color:#fff\" data-noprint>EXPORTAR CSV<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin:0 0 clamp(52px,6.5vw,82px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:clamp(22px,2.8vw,30px)\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n          <span style=\"width:26px;height:26px;border-radius:50%;background:#EEF6E2;color:#4E7220;display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" aria-hidden=\"true\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fspan>\n          <h3 style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin:0\">Entra a la plataforma<\u002Fh3>\n        <\u002Fdiv>\n        <ul style=\"padding-left:20px;margin:0;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ inclusion }}\" as=\"x\" hint-placeholder-count=\"5\">\n            <li style=\"font-size:14px;line-height:1.6;color:#3D4E52\">{{ x.text }}<\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:clamp(22px,2.8vw,30px)\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n          <span style=\"width:26px;height:26px;border-radius:50%;background:#F6E2DC;color:#9A4630;display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" aria-hidden=\"true\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg>\n          <\u002Fspan>\n          <h3 style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin:0\">Queda fuera<\u002Fh3>\n        <\u002Fdiv>\n        <ul style=\"padding-left:20px;margin:0;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ exclusion }}\" as=\"x\" hint-placeholder-count=\"5\">\n            <li style=\"font-size:14px;line-height:1.6;color:#3D4E52\">{{ x.text }}<\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;background:#F4F7F6;border-radius:16px;padding:28px 32px;margin:0 0 clamp(52px,6.5vw,82px);flex-wrap:wrap\" data-noprint>\n    <p },\n     e2:{value:'1', note:'Efectos positivos reportados, concentrados en los cuartiles bajos.'},\n     e3:{value:'1', note:'Reduce brechas entre estados; menos evidencia dentro de cada uno.'},\n     s1:{value:'Sí'},\n     s2:{value:'Sí'},\n     s3:{value:'Sí'},\n     fuentes:{value:'3', neutral:true},\n     elegibilidad:{value:'Elegible'}\n   }},\n  {id:'title1', linea:'fin', title:'Title I, Part A', country:'Estados Unidos', state:'Publicado',\n   href:P('Detalle de Caso.dc.html','detalle-caso.html'),\n   v:{\n     anio:{value:'1965', neutral:true},\n     vigencia:{value:'Rediseñada', note:'ESEA (1965), reautorizada como ESSA (2015).'},\n     tipo:{value:'Reforma'},\n     alcance:{value:'Nacional'},\n     nivel:{value:'Todos los niveles'},\n     cobertura:{value:'Focalizado a escala significativa', note:'Distritos y escuelas con alta concentración de pobreza.'},\n     region:{value:'Otra', neutral:true},\n     e1:{value:'1', note:'Las garantías históricas de asignación limitan la progresividad final.'},\n     e2:{value:'1', note:'Resultados mixtos, sensibles a la capacidad del distrito.'},\n     e3:{value:'1', note:'Depende de la distribución dentro de cada estado.'},\n     s1:{value:'Parcial'},\n     s2:{value:'Sí'},\n     s3:{value:'Parcial'},\n     fuentes:{value:'4', neutral:true},\n     elegibilidad:{value:'Elegible'}\n   }},\n\n  {id:'pta', linea:'lec', title:'Programa Todos a Aprender (PTA)', country:'Colombia', state:'Publicado',\n   href:P('Detalle de Caso.dc.html','detalle-caso.html'),\n   v:{\n     anio:{value:'2012', neutral:true},\n     vigencia:{value:'Vigente'},\n     tipo:{value:'Política'},\n     alcance:{value:'Nacional'},\n     nivel:{value:'Primaria completa'},\n     cobertura:{value:'Focalizado a escala significativa', note:'Escuelas priorizadas por resultados y vulnerabilidad.'},\n     region:{value:'LAC', neutral:true},\n     e1:{value:'2', note:'Mejoras documentadas en lenguaje en escuelas participantes.'},\n     e2:{value:'1', note:'Dato r lengua materna y ruralidad.'},\n     s1:{value:'Parcial'},\n     s2:{value:'Parcial'},\n     s3:{value:'Sí'},\n     fuentes:{value:'2', neutral:true},\n     elegibilidad:{value:'Elegible'}\n   }}\n];\n\nconst ROWS = [\n  {id:'anio', group:'Identificación', groupColor:'#4F6B72', name:'Año de inicio',\n   def:{fin:'Año de implementación de la iniciativa.', lec:'Año de implementación de la iniciativa.'}},\n\n  {id:'vigencia', group:'Elegibilidad', groupColor:'#0D4A57', name:'Vigencia',\n   def:{fin:'Estado actual: vigente, discontinuada o rediseñada. Se excluyen reformas con menos de cinco años de vigencia.',\n        lec:'Estado actual: vigente, discontinuada o rediseñada. Se excluyen reformas con menos de cinco años de vigencia.'}},\n  {id:'tipo', name:'Tipo',\n   def:{fin:'Naturaleza de la iniciativa: reforma, política o programa. Se excluyen programas acotados o parciales.',\n        lec:'Naturaleza de la iniciativa: reforma, política o programa. Debe intervenir en más de una dimensión —formación docente, materiales, acompañamiento— y combinar enseñanza del código con comprensión y estrategias dialógicas.'}},\n  {id:'alcance', name:'Alcance',\n   def:{fin:'Nivel de gobierno que implementa la iniciativa: nacional o subnacional.',\n        lec:'Nivel de gobierno que implementa la iniciativa: nacional o subnacional.'}},\n  {id:'nivel', name:'Nivel educativo',\n   def:{fin:'Niveles que cubre: preescolar, primaria inicial (1º-3º/4º), primaria completa, secundaria o todos los niveles.',\n        lec:'Niveles que cubre. Debe cubrir al menos los primeros grados de primaria, desde kínder al primer ciclo básico.'}},\n  {id:'cobertura', name:'Cobertura',\n   def:{fin:'Sistémico: aplica a todo el sistema público o a una categoría amplia y estable. Focalizado a escala significativa: segmento acotado pero con volumen relevante y sostenido. Piloto acotado: unas pocas escuelas sin escalamiento, se excluye salvo que haya escalado después.',\n        lec:'Sistémico: aplica a todo el sistema público o a una categoría amplia y estable. Focalizado a escala significativa: segmento acotado pero con volumen relevante y sostenido. Piloto acotado: unas pocas escuelas sin escalamiento, se excluye salvo que haya escalado después.'}},\n  {id:'region', name:'Región',\n   def:{fin:'LAC u otra región. Dato de registro: aún no pondera en la selección.',\n        lec:'LAC u otra región. Dato de registro: aún no pondera en la selección.'}},\n\n  {id:'e1', group:'Criterios primarios · nivel de evidencia 0-2', groupColor:'#4E7220',\n   name:{fin:'Equidad en financiamiento', lec:'Aprendizajes'},\n   def:{fin:'¿Llegó más recurso per cápita a las escuelas más vulnerables? 2 = evidencia robusta (evaluación experimental o cuasi-experimental). 1 = evidencia parcial (datos descriptivos, correlacionales o informe institucional sin diseño causal). 0 = sin evidencia.',\n        lec:'Efecto en aprendizajes de lectura y escritura. 2 = evidencia robusta (evaluación experimental o cuasi-experimental). 1 = evidencia parcial (datos descriptivos, correlacionales o informe institucional sin diseño causal). 0 = sin evidencia.'}},\n  {id:'e2', name:{fin:'Resultados educativos', lec:'Acceso y trayectorias'},\n   def:{fin:'Acceso, permanencia y aprendizajes atribuibles al mecanismo, en la misma escala de evidencia 0-2.',\n        lec:'Acceso, permanencia y trayectorias escolares atribuibles al mecanismo, en la misma escala de evidencia 0-2.'}},\n  {id:'e3', name:{fin:'Justicia educativa', lec:'Equidad y justicia educativa'},\n   def:{fin:'Reducción de brechas de aprendizaje por nivel socioeconómico, en la misma escala de evidencia 0-2.',\n        lec:'Reducción de brechas por nivel socioeconómico, geografía, lengua, etnia y discapacidad, en la misma escala de evidencia 0-2.'}},\n\n  {id:'s1', group:'Criterios secundarios · Sí / Parcial / No', groupColor:'#B4791F', name:'Costo-efectividad',\n   def:{fin:'Resultados obtenidos con uso eficiente de los recursos. El umbral exacto se acuerda con la contraparte.',\n        lec:'Resultados obtenidos con uso eficiente de los recursos. El umbral exacto se acuerda con la contraparte.'}},\n  {id:'s2', name:'Sostenibilidad y resiliencia',\n   def:{fin:'Institucionalización como política de Estado y capacidad de adaptación a crisis.',\n        lec:'Institucionalización como política de Estado y capacidad de adaptación a crisis.'}},\n  {id:'s3', name:'Innovación y replicabilidad',\n   def:{fin:'Grado de innovación y potencial de adaptación a otros contextos de la región.',\n        lec:'Grado de innovación y potencial de adaptación a otros contextos de la región.'}},\n\n  {id:'fuentes', group:'Registro', groupColor:'#4F6B72', name:'Nº de fuentes registradas',\n   def:{fin:'Cuenta automática de las fuentes cargadas para el caso en la hoja Fuentes de la línea.',\n        lec:'Cuenta automática de las fuentes cargadas para el caso en la hoja Fuentes de la línea.'}},\n  {id:'elegibilidad', name:'Elegibilidad',\n   def:{fin:'Resultado del filtro: elegible, revisar con contraparte o excluir. Se calcula a partir de los criterios anteriores.',\n        lec:'Resultado del filtro: elegible, revisar con contraparte o excluir. Se calcula a partir de los criterios anteriores.'}}\n];\n\nconst EVIDENCIA = {\n  '2':{label:'2 · Robusta', color:'#4E7220', chipBg:'#EEF6E2'},\n  '1':{label:'1 · Parcial', color:'#8A5C14', chipBg:'#FBF0DF'},\n  '0':{label:'0 · Sin evidencia', color:'#9A4630', chipBg:'#F6E2DC'}\n};\nconst EV_ROWS = ['e1','e2','e3'];\nconst POSITIVE = ['Sí','Elegible','Sistémico','Nacional','Vigente','Rediseñada','Reforma','Política'];\nconst PARTIAL = ['Parcial','Revisar','Focalizado a escala significativa','Discontinuada','Programa'];\n\nclass Component extends DCLogic {\n  state = {scrolled:false, linea:'fin', caso:'todos', open:{}};\n\n  componentDidMount(){\n    this.onScroll = () => {\n      const sc = window.scrollY > 8;\n      if(sc !== this.state.scrolled) this.setState({scrolled:sc});\n    };\n    window.addEventListener('scroll', this.onScroll, {passive:true});\n    this.onScroll();\n\n    const q = new URLSearchParams(location.search);\n    const validL = LINEAS.map(function(x){ return x.id; });\n    const caso = CASES.filter(function(c){ return c.id === q.get('caso'); })[0];\n    const l = caso ? caso.linea : q.get('linea');\n    if(l && validL.indexOf(l) > -1){\n      const self = this;\n      this.setState({linea:l, caso: caso ? caso.id : 'todos'}, function(){\n        const el = document.getElementById('matriz');\n        if(el) setTimeout(function(){\n          window.scrollTo({top: el.getBoundingClientRect().top + window.pageYOffset - 100, behavior:'smooth'});\n        }, 260);\n      });\n    }\n  }\n  componentWillUnmount(){ window.removeEventListener('scroll', this.onScroll); }\n\n  renderVals(){\n    const s = this.state, self = this;\n    const linea = LINEAS.filter(function(x){ return x.id === s.linea; })[0];\n    const lineaCases = CASES.filter(function(c){ return c.linea === s.linea; });\n    const cases = s.caso === 'todos'\n      ? lineaCases\n      : lineaCases.filter(function(c){ return c.id === s.caso; });\n\n    function chip(cell, rowId){\n      if(!cell) return {label:'—', color:'#4F6B72', chipBg:'#F0F4F3'};\n      if(EV_ROWS.indexOf(rowId) > -1 && EVIDENCIA[cell.value]){\n        const e = EVIDENCIA[cell.value];\n        return {label:e.label, color:e.color, chipBg:e.chipBg};\n      }\n      const base = {label:cell.value};\n      if(cell.na || cell.neutral) return Object.assign(base, {color:'#4F6B72', chipBg:'#F0F4F3'});\n      if(POSITIVE.indexOf(cell.value) > -1) return Object.assign(base, {color:'#4E7220', chipBg:'#EEF6E2'});\n      if(PARTIAL.indexOf(cell.value) > -1) return Object.assign(base, {color:'#8A5C14', chipBg:'#FBF0DF'});\n      return Object.assign(base, {color:'#0D4A57', chipBg:'#EAF1F2'});\n    }\n\n    return {\n      navShadow: s.scrolled ? '0 4px 20px rgba(13,74,87,.09)' : 'none',\n\n      lineaTabs: LINEAS.map(function(l){\n        const on = s.linea === l.id;\n        return {\n          label:l.label, selected: on ? 'true' : 'false',\n          select:function(){ self.setState({linea:l.id, caso:'todos', open:{}}); },\n          style:\"font-family:Lato,sans-serif;font-size:clamp(14px,1.5vw,17px);font-weight:700;background:none;border:none;padding:16px 2px;cursor:pointer;transition:all .15s;border-bottom:3px solid \" +\n            (on ? '#8BC53F' : 'transparent') + ';color:' + (on ? '#0D4A57' : '#7C8B8D')\n        };\n      }),\n      casoChips: [{id:'todos', label:'Todos los casos'}].concat(\n        lineaCases.map(function(c){ return {id:c.id, label:c.title}; })\n      ).map(function(o){\n        const on = s.caso === o.id;\n        return {\n          label:o.label, pressed: on ? 'true' : 'false',\n          select:function(){ self.setState({caso:o.id}); },\n          style:\"font-family:Lato,sans-serif;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;border:1.5px solid \" +\n            (on ? '#0D4A57;background:#0D4A57;color:#fff' : '#DCE3E1;background:#fff;color:#4F6B72')\n        };\n      }),\n      lineaIntro: linea.intro,\n      tableMin: (210 + cases.length * 215) + 'px',\n      colGridTemplate: 'repeat(' + cases.length + ',minmax(190px,1fr))',\n\n      cols: cases.map(function(c){\n        return {title:c.title, country:c.country, href:c.href};\n      }),\n\n      rows: ROWS.map(function(r, ri){\n        const open = !!s.open[r.id];\n        return {\n          name: typeof r.name === 'string' ? r.name : r.name[s.linea],\n          isGroup: !!r.group, group:r.group || '', groupColor:r.groupColor || '#8CA0A5',\n          nameTop: r.group ? '7px' : '0px',\n          rowBg: r.group ? '#FBFCFC' : '#fff',\n          open:open,\n          defLabel: open ? 'Ocultar definición' : 'Ver definición',\n          definition: r.def[s.linea],\n          toggle:function(){\n            const o = Object.assign({}, s.open); o[r.id] = !open;\n            self.setState({open:o});\n          },\n          cells: cases.map(function(c){\n            const cell = c.v[r.id] || {value:'—'};\n            const col = chip(cell, r.id);\n            return {\n              value:col.label, color:col.color, chipBg:col.chipBg,\n              bg: r.group ? '#FBFCFC' : '#fff',\n              hasNote: !!cell.note, note:cell.note || ''\n            };\n          })\n        };\n      }),\n\n      exportCsv:function(){\n        const head = ['Criterio'].concat(cases.map(function(c){ return c.title + ' (' + c.country + ')'; }));\n        const body = ROWS.map(function(r){\n          const nm = typeof r.name === 'string' ? r.name : r.name[s.linea];\n          return [nm].concat(cases.map(function(c){\n            const cell = c.v[r.id];\n            if(!cell) return '—';\n            const lbl = chip(cell, r.id).label;\n            return cell.note ? lbl + ' — ' + cell.note : lbl;\n          }));\n        });\n        const csv = [head].concat(body).map(function(row){\n          return row.map(function(v){ return '\"' + String(v).split('\"').join('\"\"') + '\"'; }).join(',');\n        }).join('\\n');\n        const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));\n        const a = document.createElement('a');\n        a.href = url; a.download = 'criterios-' + (s.caso === 'todos' ? s.linea : s.caso) + '.csv';\n        document.body.appendChild(a); a.click(); document.body.removeChild(a);\n        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);\n      },\n\n      inclusion:[\n        {text:'Reformas o políticas con al menos cinco años de vigencia, actuales, descontinuadas o rediseñadas.'},\n        {text:'Alcance nacional o subnacional estadual, con cobertura sistémica o focalizada a escala significativa.'},\n        {text:'Intervención en más de una dimensión del sistema, no en un solo componente.'},\n        {text:'Evidencia disponible de resultados educativos atribuibles al mecanismo.'},\n        {text:'Evidencia de reducción de brechas de aprendizaje entre grupos.'},\n        {text:'En financiamiento: progresividad verificable a nivel de estudiante.'}\n      ],\n      exclusion:[\n        {text:'Programas acotados o parciales que intervienen en una sola dimensión.'},\n        {text:'Reformas con menos de cinco años de vigencia.'},\n        {text:'Iniciativas de alcance local o institucional aislado.'},\n        {text:'Casos sin evidencia documentada de resultados ni de efectos distributivos.'},\n        {text:'En lectoescritura: modelos que trabajan solo el código, sin comprensión ni estrategias dialógicas.'},\n        {text:'En lectoescritura: reformas que no cubren los primeros grados de primaria.'}\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
