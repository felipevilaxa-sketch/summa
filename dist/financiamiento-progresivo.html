  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  }\n  details.rfl-acc > summary::-webkit-details-marker{display:none}\n  details.rfl-acc > summary:hover{background:#F9FBFA}\n  details.rfl-acc[open] > summary{background:#F4F7F6;border-bottom:1px solid #DCE3E1}\n  details.rfl-acc .acc-icon{\n    flex-shrink:0;width:32px;height:32px;border-radius:50%;background:#EEF6E2;\n    display:flex;align-items:center;justify-content:center;transition:transform .25s;\n  }\n  details.rfl-acc[open] .acc-icon{transform:rotate(45deg);background:#0D4A57}\n  details.rfl-acc[open] .acc-icon svg{stroke:#fff}\n  details.rfl-acc .acc-body{padding:28px 26px 30px}\n\n  /* ── Expert cards ──────────────────────────────────────────── */\n  .expert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}\n  .expert-card{border:1px solid #DCE3E1;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}\n  .expert-avatar{width:64px;height:64px;border-radius:50%;background:#0D4A57;display:flex;align-items:center;justify-content:center;font-family:Lato,sans-serif;font-weight:700;font-size:22px;color:#fff;flex-shrink:0}\n  .expert-avatar.green{background:#6FA030}\n  .expert-avatar.teal{background:#0D4A57}\n  .expert-avatar.olive{background:#3B6B42}\n\n  /* ── Stat cards ────────────────────────────────────────────── */\n  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:0 0 28px}\n  .stat-card{background:#F4F7F6;border-radius:16px;padding:24px 26px}\n  .stat-num{font-family:Lato,sans-serif;font-weight:900;font-size:clamp(38px,5vw,52px);line-height:1;color:#0D4A57;margin-bottom:8px}\n  .stat-label{font-family:Lato,sans-serif;font-size:14px;line-height:1.5;color:#516268}\n\n  /* ── Principle list ────────────────────────────────────────── */\n  .prin-list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}\n  .prin-item{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:#F9FBFA;border-radius:12px;border-left:3px solid #8BC53F}\n  .prin-dot{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#EEF6E2;display:flex;align-items:center;justify-content:center}\n\n  /* ── Evidence ──────────────────────────────────────────────── */\n  .evid-body p{font-size:15.5px;line-height:1.72;color:#516268;margin:0 0 16px}\n  .evid-body p:last-child{margin-bottom:0}\n\n  /* ── ODS badge ─────────────────────────────────────────────── */\n  .ods-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}\n  .ods-badge{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #DCE3E1;border-radius:8px;padding:8px 14px;font-family:Lato,sans-serif;font-size:12.5px;font-weight:700;color:#0D4A57}\n  .ods-swatch{width:22px;height:22px;border-radius:4px;flex-shrink:0}\n</style>\n<template id=\"__bundler_thumbnail\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#0D4A57\"/><rect x=\"24\" y=\"56\" width=\"12\" height=\"18\" rx=\"3\" fill=\"#FFFFFF\" opacity=\".7\"/><rect x=\"44\" y=\"44\" width=\"12\" height=\"30\" rx=\"3\" fill=\"#8BC53F\"/><rect x=\"64\" y=\"32\" width=\"12\" height=\"42\" rx=\"3\" fill=\"#E8A33D\"/></svg></template>\n</helmet>\n\n<!-- ══════════════════════════════════════════════════════ NAV -->\n<div style=\"width:100%;position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;box-shadow:{{ navShadow }};transition:box-shadow .25s ease\" data-noprint>\n  <nav data-m=\"topnav\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px clamp(20px,4vw,40px);max-width:1240px;margin:0 auto\">\n    <a href=\"index.html\" style=\"display:flex;align-items:center;gap:14px\" data-m=\"brand\">\n      <img src=\"assets/logo-summa-lab.png\" alt=\"SUMMA\" style=\"height:56px;width:auto\">\n      <span style=\"display:flex;flex-direction:column;justify-content:center;line-height:1.2;font-family:Lato,sans-serif;color:#0D4A57;padding-left:14px;border-left:1.5px solid #DCE3E1;align-self:stretch\">\n        <span style=\"font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase\">Plataforma de</span>\n        <span style=\"font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase\">Reformas Educativas</span>\n      </span>\n    </a>\n    <div data-m=\"navlinks\" style=\"display:flex;align-items:center;gap:clamp(16px,2.5vw,34px);font-family:Lato,sans-serif;font-size:14.5px;color:#0D4A57\">\n      <a href=\"marco-wise.html\" style=\"color:#0D4A57\">Marco WISE</a>\n      <a href=\"lineas-de-reforma.html\" style=\"color:#0D4A57;font-weight:700;border-bottom:2px solid #8BC53F;padding-bottom:2px\">Líneas de Reforma</a>\n    </div>\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <x-import component-from-global-scope=\"site-search\" from=\"./site-search.js\" hint-size=\"40px,40px\"></x-import>\n      <span data-m=\"hamburger\"><x-import component-from-global-scope=\"mobile-nav\" from=\"./mobile-nav.js\" hint-size=\"44px,44px\"></x-import></span>\n      <a href=\"casos.html\" style=\"font-family:Lato,sans-serif;border:1.5px solid #0D4A57;background:#0D4A57;color:#fff;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s\" style-hover=\"background:none;color:#0D4A57\" data-m=\"navcta\">EXPLORAR CASOS</a>\n    </div>\n  </nav>\n</div>\n<div data-m=\"spacer\" aria-hidden=\"true\" style=\"height:81px\" data-noprint></div>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n\n  <!-- BREADCRUMB -->\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;font-family:Lato,sans-serif;font-size:12.5px;font-weight:500;color:#7C8B8D;margin:26px 0 24px\" data-noprint>\n    <a href=\"index.html\" style=\"color:#7C8B8D\">Inicio</a><span style=\"color:#C2CCCE\">/</span><a href=\"lineas-de-reforma.html\" style=\"color:#7C8B8D\">Líneas de Reforma</a><span style=\"color:#C2CCCE\">/</span><span style=\"color:#0D4A57;font-weight:600\">Financiamiento progresivo</span>\n  </div>\n\n  <!-- ══════════════════════════════════════════════════ HERO -->\n  <header style=\"margin:0 0 clamp(56px,7vw,80px)\">\n    <div style=\"position:relative;background:#F4F7F6;border-radius:16px;padding:clamp(38px,4.6vw,68px) clamp(32px,4vw,56px);overflow:hidden;min-height:clamp(300px,28vw,360px);display:flex;flex-direction:column;justify-content:center\">\n      <div data-m=\"ldr-hero-icon\" role=\"img\" aria-hidden=\"true\" style=\"position:absolute;right:clamp(-90px,-6vw,-40px);top:50%;transform:translateY(-50%);width:clamp(340px,42vw,540px);height:clamp(340px,42vw,540px);background-image:url(assets/icono-financiamiento.png);background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.16;pointer-events:none\"></div>\n      <div style=\"position:relative;max-width:620px\">\n        <span style=\"display:inline-flex;align-items:center;gap:6px;background:#EEF6E2;color:#6FA030;font-family:Lato,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:6px 14px;border-radius:6px;margin-bottom:16px\">Línea de reforma</span>\n        <h1 style=\"font-family:Lato,sans-serif;font-weight:700;font-size:clamp(30px,4.2vw,48px);line-height:1.12;letter-spacing:-.01em;color:#0D4A57;margin:0 0 18px\">Financiamiento<br>progresivo</h1>\n        <p style=\"font-size:16px;line-height:1.65;color:#3D4E52;margin:0 0 26px;max-width:500px\">Qué mecanismos permiten que los recursos lleguen a quienes más los necesitan, y qué se requiere para que ese dinero se traduzca en mejores aprendizajes.</p>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <a href=\"#casos\" style=\"font-family:Lato,sans-serif;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,#8BC53F 0%,#D4FBA1 100%);background-size:180% 100%;background-position:0% 0%;color:#0D4A57;font-size:13px;letter-spacing:.04em;padding:14px 26px;border-radius:999px;text-decoration:none;transition:background-position .35s ease\" style-hover=\"background-position:100% 0%\">VER CASOS\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><polyline points=\"5 12 12 19 19 12\"/></svg>\n          </a>\n        </div>\n      </div>\n    </div>\n  </header>\n\n  <!-- ═══════════════════════════════════ POR QUÉ ESTA LÍNEA -->\n  <section style=\"margin:0 0 clamp(56px,7vw,88px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,4vw,56px);align-items:start\">\n      <div>\n        <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Por qué esta línea</div>\n        <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.25;color:#0D4A57;margin:0 0 20px\">Más gasto no equivale a mejores resultados</h2>\n        <p style=\"font-size:15.5px;line-height:1.72;color:#516268;margin:0 0 16px\">Superado un umbral mínimo, la evidencia internacional no encuentra relación directa entre el gasto acumulado por estudiante y su desempeño académico. Lo que pasa a ser determinante es el diseño del mecanismo de asignación y la distribución final de los recursos.</p>\n        <p style=\"font-size:15.5px;line-height:1.72;color:#516268;margin:0\">América Latina elevó su inversión educativa del 3% al 5% del PIB entre 1995 y 2014, pero retrocedió a 3,9% en 2022 por la presión fiscal post-pandemia. En ese escenario, cómo se reparte cada peso importa más que nunca.</p>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:20px 22px;border-left:4px solid #0D4A57\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:14.5px;color:#17242A;margin-bottom:5px\">Equidad de base</div>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Garantizar un piso de recursos similar para todos los estudiantes, independiente de su origen o territorio.</p>\n        </div>\n        <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:20px 22px;border-left:4px solid #8BC53F\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:14.5px;color:#17242A;margin-bottom:5px\">Progresividad efectiva</div>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Asignar mayores recursos a quienes enfrentan mayores desventajas socioeconómicas, educativas o territoriales.</p>\n        </div>\n        <div style=\"border:1px solid #DCE3E1;border-radius:16px;padding:20px 22px;border-left:4px solid #E8A33D\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:14.5px;color:#17242A;margin-bottom:5px\">Rendición de cuentas</div>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#516268\">Asegurar que los recursos lleguen a destino y generen el impacto esperado mediante seguimiento y evaluación continuos.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <!-- ═══════════════════════ SITUACIÓN MUNDIAL Y REGIONAL -->\n  <section style=\"margin:0 0 clamp(56px,7vw,88px)\">\n    <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Situación mundial y regional</div>\n    <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.25;color:#0D4A57;margin:0 0 28px;max-width:680px\">El financiamiento educativo en América Latina: una deuda pendiente con la equidad</h2>\n\n    <div class=\"stat-strip\">\n      <div class=\"stat-card\">\n        <div class=\"stat-num\">13%</div>\n        <div class=\"stat-label\">de los países de ALC cuenta con fórmulas de distribución que incluyen un componente de equidad <strong>explícito y vinculante</strong></div>\n      </div>\n      <div class=\"stat-card\">\n        <div class=\"stat-num\">30%</div>\n        <div class=\"stat-label\">menos recursos por estudiante reciben en promedio las escuelas del quintil más vulnerable respecto a las del quintil más favorecido</div>\n      </div>\n      <div class=\"stat-card\">\n        <div class=\"stat-num\">3,9%</div>\n        <div class=\"stat-label\">del PIB destinó América Latina a educación en 2022, por debajo del 5% promedio alcanzado en 2014 antes de la pandemia</div>\n      </div>\n    </div>\n\n    <p style=\"font-size:12.5px;color:#7C8B8D;margin:0;font-family:Lato,sans-serif\">Fuente: <a href=\"https://werd.stanford.edu/database\" target=\"_blank\" rel=\"noopener\" style=\"color:#7C8B8D;text-decoration:underline\">WERD Stanford University Database</a></p>\n  </section>\n\n  <!-- ═══════════════════════ QUÉ ENTENDEMOS POR ESTA LÍNEA -->\n  <section id=\"que-entendemos\" style=\"margin:0 0 clamp(56px,7vw,88px);scroll-margin-top:110px\">\n    <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Marco conceptual</div>\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px\">\n      <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.25;color:#0D4A57;margin:0;max-width:620px\">¿Qué entendemos por financiamiento progresivo?</h2>\n    </div>\n\n    <!-- Acordeón item 1 -->\n    <details class=\"rfl-acc\" open>\n      <summary>\n        <span style=\"display:flex;align-items:center;gap:14px\">\n          <span style=\"flex-shrink:0;width:36px;height:36px;border-radius:10px;background:#EEF6E2;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FA030\" stroke-width=\"2.2\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/></svg>\n          </span>\n          Dimensiones operativas y principios fundamentales\n        </span>\n        <span class=\"acc-icon\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FA030\" stroke-width=\"2.5\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/></svg>\n        </span>\n      </summary>\n      <div class=\"acc-body\">\n        <p style=\"font-size:15px;line-height:1.7;color:#516268;margin:0 0 20px\">El financiamiento progresivo no es solo una cuestión de volumen de gasto: se articula en torno a cinco dimensiones que, cuando funcionan de manera coherente, permiten que los recursos educativos cumplan su función redistributiva.</p>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Progresividad</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">Los recursos adicionales se dirigen de forma explícita y verificable hacia las poblaciones, escuelas o territorios con mayores desventajas socioeconómicas.</p>\n          </div>\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Transparencia y criterios públicos</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">Los mecanismos de asignación deben ser comprensibles, conocidos por todos los actores del sistema y sujetos a escrutinio externo.</p>\n          </div>\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Eficiencia asignativa</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">Los recursos se destinan a intervenciones con evidencia de impacto en aprendizaje, evitando la dispersión presupuestaria sin propósito pedagógico claro.</p>\n          </div>\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Universalidad de base</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">Antes de la progresividad diferenciada, se garantiza un piso mínimo de recursos para todos los establecimientos, sin distinción.</p>\n          </div>\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Rendición de cuentas y evaluación continua</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">El diseño contempla mecanismos de seguimiento que permiten verificar si los recursos llegaron a destino y si generaron los resultados esperados.</p>\n          </div>\n        </div>\n      </div>\n    </details>\n\n    <!-- Acordeón item 2 -->\n    <details class=\"rfl-acc\" style=\"margin-top:10px\">\n      <summary>\n        <span style=\"display:flex;align-items:center;gap:14px\">\n          <span style=\"flex-shrink:0;width:36px;height:36px;border-radius:10px;background:#EEF6E2;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FA030\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/></svg>\n          </span>\n          Mecanismos para determinar la distribución de recursos\n        </span>\n        <span class=\"acc-icon\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FA030\" stroke-width=\"2.5\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/></svg>\n        </span>\n      </summary>\n      <div class=\"acc-body\">\n        <p style=\"font-size:15px;line-height:1.7;color:#516268;margin:0 0 20px\">Los sistemas de financiamiento progresivo se articulan a través de mecanismos concretos que determinan cómo y cuánto recibe cada escuela o jurisdicción. La elección del mecanismo tiene implicancias directas en la equidad del sistema.</p>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Fórmulas per cápita con ponderadores de equidad</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">El presupuesto se asigna por estudiante, pero incorpora multiplicadores que aumentan el monto para alumnos en situación de vulnerabilidad socioeconómica, zona rural o con necesidades educativas especiales. Es el mecanismo más difundido en OCDE.</p>\n          </div>\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Fondos focalizados y concursables</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">Recursos adicionales asignados mediante convocatorias abiertas que priorizan establecimientos en zonas de alta vulnerabilidad. Requieren presentar proyectos pedagógicos y compromisos de mejora medibles.</p>\n          </div>\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Transferencias condicionadas al desempeño</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">Una parte del presupuesto se libera según el cumplimiento de indicadores educativos preacordados (asistencia, retención, logros de aprendizaje). Genera incentivos pero requiere sistemas de información robustos.</p>\n          </div>\n        </div>\n      </div>\n    </details>\n\n    <!-- Acordeón item 3 -->\n    <details class=\"rfl-acc\" style=\"margin-top:10px\">\n      <summary>\n        <span style=\"display:flex;align-items:center;gap:14px\">\n          <span style=\"flex-shrink:0;width:36px;height:36px;border-radius:10px;background:#EEF6E2;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FA030\" stroke-width=\"2.2\"><line x1=\"8\" y1=\"6\" x2=\"21\" y2=\"6\"/><line x1=\"8\" y1=\"12\" x2=\"21\" y2=\"12\"/><line x1=\"8\" y1=\"18\" x2=\"21\" y2=\"18\"/><line x1=\"3\" y1=\"6\" x2=\"3.01\" y2=\"6\"/><line x1=\"3\" y1=\"12\" x2=\"3.01\" y2=\"12\"/><line x1=\"3\" y1=\"18\" x2=\"3.01\" y2=\"18\"/></svg>\n          </span>\n          Tipos de financiamiento progresivo\n        </span>\n        <span class=\"acc-icon\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6FA030\" stroke-width=\"2.5\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/></svg>\n        </span>\n      </summary>\n      <div class=\"acc-body\">\n        <p style=\"font-size:15px;line-height:1.7;color:#516268;margin:0 0 20px\">Según el diseño institucional y los objetivos de política, el financiamiento progresivo adopta distintas modalidades que pueden combinarse dentro de un mismo sistema.</p>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Subvención diferenciada</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">Monto base universal más un suplemento escalonado que aumenta según el nivel de vulnerabilidad del estudiante o del establecimiento.</p>\n          </div>\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Financiamiento por resultados</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">Parte del presupuesto se asigna retroactivamente según el logro de metas de aprendizaje, acceso o permanencia acordadas con las escuelas.</p>\n          </div>\n          <div style=\"background:#fff;border:1px solid #DCE3E1;border-radius:14px;padding:22px 24px\">\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#0D4A57;margin-bottom:6px\">Financiamiento territorial</div>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:#516268\">La distribución se ajusta por costo real de provisión educativa en cada región o municipio, incorporando variables como ruralidad, distancia o costo de vida.</p>\n          </div>\n        </div>\n      </div>\n    </details>\n\n    <!-- CTA descargar PDF -->\n    <div style=\"margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#F4F7F6;border-radius:14px;padding:20px 26px;flex-wrap:wrap\">\n      <div>\n        <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:14.5px;color:#0D4A57;margin-bottom:4px\">Ampliar esta información</div>\n        <p style=\"margin:0;font-size:13.5px;color:#516268\">Descarga el documento completo con el desarrollo conceptual de esta línea de reforma.</p>\n      </div>\n      <a href=\"#\" style=\"flex-shrink:0;display:inline-flex;align-items:center;gap:8px;font-family:Lato,sans-serif;font-weight:700;font-size:13px;color:#0D4A57;border:1.5px solid #0D4A57;border-radius:999px;padding:11px 22px;white-space:nowrap;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><polyline points=\"7 10 12 15 17 10\"/><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"/></svg>\n        DESCARGAR PDF\n      </a>\n    </div>\n  </section>\n\n  <!-- ══════════════════════════ CARACTERÍSTICAS DE IMPLEMENTACIÓN -->\n  <section style=\"margin:0 0 clamp(56px,7vw,88px)\">\n    <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Características de implementación</div>\n    <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(22px,2.8vw,30px);line-height:1.28;color:#0D4A57;margin:0 0 36px\">Cinco etapas para instalar un sistema de financiamiento progresivo</h2>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n\n      <!-- Etapa 1: espaciador transparent arriba (centra), línea real abajo extendida al gap -->\n      <div style=\"display:grid;grid-template-columns:56px 1fr;gap:24px;align-items:stretch;padding-bottom:20px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center\">\n          <div style=\"flex:1;width:2px;background:transparent\"></div>\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#0D4A57;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff,0 0 0 5px #DCE3E1\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:900;font-size:18px;color:#fff\">1</span>\n          </div>\n          <div style=\"flex:1;width:2px;background:#DCE3E1;margin-top:6px;margin-bottom:-20px\"></div>\n        </div>\n        <div style=\"align-self:center;background:#fff;border:1px solid #DCE3E1;border-radius:16px;padding:26px 28px\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin-bottom:8px\">Diagnóstico y línea de base</div>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#516268\">Antes de rediseñar el esquema de asignación, el sistema debe levantar información confiable sobre la distribución actual de recursos: cuánto recibe cada escuela, cómo se calcula, qué variables determinan las diferencias y qué brechas existen entre establecimientos de distinto perfil socioeconómico.</p>\n        </div>\n      </div>\n\n      <!-- Etapa 2: línea real arriba y abajo extendida al gap -->\n      <div style=\"display:grid;grid-template-columns:56px 1fr;gap:24px;align-items:stretch;padding-bottom:20px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center\">\n          <div style=\"flex:1;width:2px;background:#DCE3E1;margin-bottom:6px\"></div>\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#0D4A57;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff,0 0 0 5px #DCE3E1\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:900;font-size:18px;color:#fff\">2</span>\n          </div>\n          <div style=\"flex:1;width:2px;background:#DCE3E1;margin-top:6px;margin-bottom:-20px\"></div>\n        </div>\n        <div style=\"align-self:center;background:#fff;border:1px solid #DCE3E1;border-radius:16px;padding:26px 28px\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin-bottom:8px\">Diseño del mecanismo de distribución</div>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#516268\">Se definen los criterios, ponderadores y fórmulas que determinarán la asignación diferenciada: qué variables de vulnerabilidad se incorporan, qué peso relativo tienen, cuál es el monto base universal y cuánto adicional recibirán los estudiantes en situación prioritaria. Esta etapa involucra negociación política y técnica entre el ministerio, las jurisdicciones y actores de la sociedad civil.</p>\n        </div>\n      </div>\n\n      <!-- Etapa 3: línea real arriba y abajo extendida al gap -->\n      <div style=\"display:grid;grid-template-columns:56px 1fr;gap:24px;align-items:stretch;padding-bottom:20px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center\">\n          <div style=\"flex:1;width:2px;background:#DCE3E1;margin-bottom:6px\"></div>\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#0D4A57;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff,0 0 0 5px #DCE3E1\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:900;font-size:18px;color:#fff\">3</span>\n          </div>\n          <div style=\"flex:1;width:2px;background:#DCE3E1;margin-top:6px;margin-bottom:-20px\"></div>\n        </div>\n        <div style=\"align-self:center;background:#fff;border:1px solid #DCE3E1;border-radius:16px;padding:26px 28px\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin-bottom:8px\">Implementación piloto y ajuste técnico</div>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#516268\">La fórmula se aplica en un conjunto acotado de jurisdicciones o establecimientos seleccionados para probar su funcionamiento real. Se identifican los cuellos de botella administrativos, se ajustan los registros de estudiantes y se fortalece la capacidad de las escuelas para rendir cuenta del uso de los recursos adicionales.</p>\n        </div>\n      </div>\n\n      <!-- Etapa 4: línea real arriba y abajo extendida al gap -->\n      <div style=\"display:grid;grid-template-columns:56px 1fr;gap:24px;align-items:stretch;padding-bottom:20px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center\">\n          <div style=\"flex:1;width:2px;background:#DCE3E1;margin-bottom:6px\"></div>\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#0D4A57;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff,0 0 0 5px #DCE3E1\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:900;font-size:18px;color:#fff\">4</span>\n          </div>\n          <div style=\"flex:1;width:2px;background:#DCE3E1;margin-top:6px;margin-bottom:-20px\"></div>\n        </div>\n        <div style=\"align-self:center;background:#fff;border:1px solid #DCE3E1;border-radius:16px;padding:26px 28px\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin-bottom:8px\">Escalamiento y consolidación normativa</div>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#516268\">Validada la fórmula en el piloto, el mecanismo se extiende al conjunto del sistema. Esta etapa requiere anclar el diseño en legislación o normativa presupuestaria que garantice su continuidad más allá de los ciclos de gobierno. La sostenibilidad depende de que los criterios de asignación estén institucionalizados y no dependan de decisiones discrecionales anuales.</p>\n        </div>\n      </div>\n\n      <!-- Etapa 5: línea real arriba, espaciador transparent abajo (centra), sin extensión -->\n      <div style=\"display:grid;grid-template-columns:56px 1fr;gap:24px;align-items:stretch\">\n        <div style=\"display:flex;flex-direction:column;align-items:center\">\n          <div style=\"flex:1;width:2px;background:#DCE3E1;margin-bottom:6px\"></div>\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#0D4A57;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff,0 0 0 5px #DCE3E1\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:900;font-size:18px;color:#fff\">5</span>\n          </div>\n          <div style=\"flex:1;width:2px;background:transparent\"></div>\n        </div>\n        <div style=\"align-self:center;background:#fff;border:1px solid #DCE3E1;border-radius:16px;padding:26px 28px\">\n          <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;color:#0D4A57;margin-bottom:8px\">Evaluación de impacto y mejora continua</div>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#516268\">El sistema incorpora mecanismos periódicos de evaluación que permiten verificar si los recursos adicionales llegaron a los estudiantes previstos y si se tradujeron en mejoras medibles de aprendizaje, retención o equidad. Los resultados retroalimentan el diseño de la fórmula: los ponderadores se actualizan según la evolución de las condiciones socioeconómicas y los criterios de focalización se refinan con nueva evidencia.</p>\n        </div>\n      </div>\n\n    </div>\n  </section>\n\n  <!-- ═══════════════════════════════════ EVIDENCIA DISPONIBLE -->\n  <section style=\"margin:0 0 clamp(56px,7vw,88px)\">\n    <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Evidencia disponible</div>\n    <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(22px,2.8vw,30px);line-height:1.28;color:#0D4A57;margin:0 0 20px\">¿Qué nos dice la investigación sobre su efectividad?</h2>\n    <div class=\"evid-body\">\n      <p>Los estudios sobre financiamiento diferenciado en países de la OCDE muestran efectos positivos y significativos cuando la focalización alcanza al menos al 20% de los estudiantes más vulnerables y los recursos se acompañan de apoyo pedagógico directo a las escuelas.</p>\n      <p>La revisión de Jackson et al. (2016) para Estados Unidos encontró que un aumento del 10% en el gasto escolar a lo largo de la trayectoria K-12 se asocia con un 7% de incremento en los salarios adultos y una reducción del 3,7% en la probabilidad de vivir en pobreza. El efecto es significativamente mayor para estudiantes de bajos ingresos.</p>\n      <p>En América Latina, la evidencia es más heterogénea. Los programas con componente de equidad explícito (como la SEP chilena o el FUNDEB brasileño) muestran mejoras en acceso y retención, pero los resultados en aprendizajes son mixtos, condicionados por la capacidad institucional para convertir el dinero en intervenciones efectivas.</p>\n    </div>\n  </section>\n\n  <!-- ════════════════════════ OTRAS CUESTIONES PARA ENTENDER -->\n  <section style=\"margin:0 0 clamp(56px,7vw,88px)\">\n    <div style=\"background:#F4F7F6;border-radius:16px;padding:clamp(32px,4vw,52px)\">\n      <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Matices de la línea</div>\n      <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(22px,2.8vw,30px);line-height:1.28;color:#0D4A57;margin:0 0 20px;max-width:640px\">Dimensiones complementarias que condicionan el impacto</h2>\n      <p style=\"font-size:15.5px;line-height:1.72;color:#516268;margin:0;max-width:780px\">El financiamiento progresivo opera en sistemas donde coexisten niveles de gobernanza nacional, subnacional y local, lo que exige coordinación intergubernamental permanente. Su efectividad depende de la calidad de la información disponible: sin datos confiables sobre vulnerabilidad socioeconómica y resultados educativos, los ponderadores de equidad pierden sentido. Además, los efectos de estas reformas se acumulan en el tiempo, por lo que los ciclos políticos cortos y la ausencia de marcos legales robustos representan un riesgo real para su continuidad y sostenibilidad.</p>\n    </div>\n  </section>\n\n  <!-- ══════════════════════════════════ CRITERIOS (CTA BANNER) -->\n  <section style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;background:#F4F7F6;border-radius:16px;padding:28px 32px;margin:0 0 clamp(56px,7vw,88px);flex-wrap:wrap\" data-noprint>\n    <div style=\"max-width:600px\">\n      <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:6px\">Criterios aplicados a los casos</div>\n      <p style=\"font-family:Lato,sans-serif;font-size:17px;color:#0D4A57;margin:0\">Revisa qué criterio de elegibilidad, primario y secundario aplica a cada caso de esta línea.</p>\n    </div>\n    <a href=\"criterios-de-seleccion.html?linea=fin#matriz\" style=\"font-family:Lato,sans-serif;border:1.5px solid #0D4A57;color:#0D4A57;font-size:13px;letter-spacing:.03em;padding:11px 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,color .15s\" style-hover=\"background:#0D4A57;color:#fff\">VER CRITERIOS DE SELECCIÓN\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"12 5 19 12 12 19\"/></svg>\n    </a>\n  </section>\n\n  <!-- ═══════════════════════════════════════════════ CASOS -->\n  <section id=\"casos\" style=\"margin:0 0 clamp(56px,7vw,88px);scroll-margin-top:100px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px\">\n      <div>\n        <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Casos de la línea</div>\n        <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);line-height:1.25;color:#0D4A57;margin:0;max-width:560px\">Mecanismos distintos para un mismo objetivo</h2>\n      </div>\n    </div>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px\">\n      <a href=\"detalle-caso.html\" style=\"border:1px solid #DCE3E1;border-radius:16px;background:#fff;overflow:hidden;display:flex;flex-direction:column;text-decoration:none\">\n        <div style=\"position:relative;aspect-ratio:16/7;background-color:#F4F7F6;background-image:url(assets/case-1.jpg);background-size:cover;background-position:center\">\n          <span style=\"position:absolute;top:14px;left:14px;background:#fff;color:#0D4A57;font-family:Lato,sans-serif;font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:6px\">Financiamiento progresivo</span>\n        </div>\n        <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;flex:1\">\n          <div style=\"display:flex;align-items:center;gap:6px;font-family:Lato,sans-serif;font-size:12px;font-weight:600;color:#516268;margin-bottom:10px\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:#8BC53F\"></span>Chile\n          </div>\n          <h3 style=\"font-family:Lato,sans-serif;font-weight:700;font-size:21px;color:#0D4A57;margin:0 0 18px;line-height:1.3\">Subvención Escolar Preferencial (SEP)</h3>\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:20px\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:700;font-size:30px;color:#0D4A57;line-height:1\">2008</span>\n            <span style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:500;color:#516268;line-height:1.4\">año de entrada en vigencia</span>\n          </div>\n          <p style=\"font-size:14px;line-height:1.6;color:#516268;margin:0 0 auto\">Transferencia adicional por estudiante prioritario o preferente que las escuelas deben usar en mejora pedagógica comprobable.</p>\n          <div style=\"margin-top:18px;display:flex;align-items:center;gap:6px;font-family:Lato,sans-serif;font-size:13px;font-weight:700;color:#0D4A57\">Ver caso <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"12 5 19 12 12 19\"/></svg></div>\n        </div>\n      </a>\n      <a href=\"detalle-caso.html\" style=\"border:1px solid #DCE3E1;border-radius:16px;background:#fff;overflow:hidden;display:flex;flex-direction:column;text-decoration:none\">\n        <div style=\"position:relative;aspect-ratio:16/7;background-color:#F4F7F6;background-image:url(assets/case-2.jpg);background-size:cover;background-position:center\">\n          <span style=\"position:absolute;top:14px;left:14px;background:#fff;color:#0D4A57;font-family:Lato,sans-serif;font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:6px\">Financiamiento progresivo</span>\n        </div>\n        <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;flex:1\">\n          <div style=\"display:flex;align-items:center;gap:6px;font-family:Lato,sans-serif;font-size:12px;font-weight:600;color:#516268;margin-bottom:10px\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:#8BC53F\"></span>Brasil\n          </div>\n          <h3 style=\"font-family:Lato,sans-serif;font-weight:700;font-size:21px;color:#0D4A57;margin:0 0 18px;line-height:1.3\">FUNDEB — Fondo de Mantenimiento y Desarrollo de la Educación Básica</h3>\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:20px\">\n            <span style=\"font-family:Lato,sans-serif;font-weight:700;font-size:30px;color:#0D4A57;line-height:1\">2007</span>\n            <span style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:500;color:#516268;line-height:1.4\">año de implementación</span>\n          </div>\n          <p style=\"font-size:14px;line-height:1.6;color:#516268;margin:0 0 auto\">Fondo federal-estadual con ponderadores por etapa educativa y ubicación que redistribuye recursos hacia municipios con menor capacidad fiscal.</p>\n          <div style=\"margin-top:18px;display:flex;align-items:center;gap:6px;font-family:Lato,sans-serif;font-size:13px;font-weight:700;color:#0D4A57\">Ver caso <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"12 5 19 12 12 19\"/></svg></div>\n        </div>\n      </a>\n    </div>\n  </section>\n\n  <!-- ════════════════════════════════════════ ESPECIALISTAS -->\n  <section style=\"margin:0 0 clamp(56px,7vw,88px)\">\n    <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Especialistas a cargo del contenido</div>\n    <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(22px,2.8vw,30px);line-height:1.28;color:#0D4A57;margin:0 0 14px;max-width:640px\">El contenido de esta línea fue desarrollado por expertos internacionales</h2>\n    <p style=\"font-size:15.5px;line-height:1.7;color:#516268;margin:0 0 28px;max-width:720px\">Para asegurar la solidez académica y la pertinencia regional de cada línea de reforma, SUMMA contrató especialistas con trayectoria comprobada en investigación y política educativa comparada.</p>\n    <div class=\"expert-grid\">\n      <div class=\"expert-card\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <div class=\"expert-avatar teal\">JS</div>\n          <div>\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#17242A\">Dr. Juan Pablo Silva</div>\n            <div style=\"font-family:Lato,sans-serif;font-size:12.5px;color:#6FA030;font-weight:700;margin-top:2px\">Economista de la educación</div>\n          </div>\n        </div>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.65;color:#516268\">Especialista en sistemas de financiamiento escolar y análisis de equidad educativa en contextos latinoamericanos. Investigador principal en PREAL y consultor del Banco Mundial en más de 12 países de la región.</p>\n      </div>\n      <div class=\"expert-card\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <div class=\"expert-avatar green\">AC</div>\n          <div>\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#17242A\">Dra. Alejandra Cardini</div>\n            <div style=\"font-family:Lato,sans-serif;font-size:12.5px;color:#6FA030;font-weight:700;margin-top:2px\">Politóloga educativa</div>\n          </div>\n        </div>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.65;color:#516268\">Especializada en política educativa comparada y gobernanza de sistemas educativos. Directora del Programa de Educación de CIPPEC y docente en la Universidad Torcuato Di Tella, Argentina.</p>\n      </div>\n      <div class=\"expert-card\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <div class=\"expert-avatar olive\">MG</div>\n          <div>\n            <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#17242A\">Lic. Mario Garnier</div>\n            <div style=\"font-family:Lato,sans-serif;font-size:12.5px;color:#6FA030;font-weight:700;margin-top:2px\">Político y reformador educativo</div>\n          </div>\n        </div>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.65;color:#516268\">Ex Ministro de Educación de Costa Rica (2006–2014) y artífice de una de las reformas de financiamiento progresivo más exitosas de la región. Investigador afiliado en el DiáLogos Education Network.</p>\n      </div>\n    </div>\n  </section>\n\n  <!-- ═══════════════════════════════ COMITÉ DE REVISIÓN -->\n  <section style=\"margin:0 0 clamp(72px,9vw,110px)\">\n    <div style=\"background:#F4F7F6;border-radius:16px;padding:clamp(32px,4vw,48px)\">\n      <div style=\"font-family:Lato,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6FA030;margin-bottom:8px\">Comité de revisión y validación</div>\n      <h2 style=\"font-family:Lato,sans-serif;font-weight:400;font-size:clamp(22px,2.8vw,30px);line-height:1.28;color:#0D4A57;margin:0 0 14px;max-width:640px\">Pares académicos que validaron el rigor de los contenidos</h2>\n      <p style=\"font-size:15.5px;line-height:1.7;color:#516268;margin:0 0 28px;max-width:700px\">Un comité de revisión externo, compuesto por académicos e investigadores de reconocida trayectoria internacional, evaluó los contenidos de cada línea para garantizar su calidad, precisión y pertinencia para la región.</p>\n      <div class=\"expert-grid\">\n        <div style=\"border:1px solid #DCE3E1;background:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;align-items:center;gap:14px\">\n            <div class=\"expert-avatar\" style=\"background:#374649\">BB</div>\n            <div>\n              <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#17242A\">Dra. Bárbara Bruns</div>\n              <div style=\"font-family:Lato,sans-serif;font-size:12.5px;color:#6FA030;font-weight:700;margin-top:2px\">Center for Global Development</div>\n            </div>\n          </div>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.65;color:#516268\">Senior Fellow en CGD y execonomista principal de educación del Banco Mundial. Autora de <em>Great Teachers</em> y experta en evaluación docente y financiamiento educativo comparado.</p>\n        </div>\n        <div style=\"border:1px solid #DCE3E1;background:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;align-items:center;gap:14px\">\n            <div class=\"expert-avatar\" style=\"background:#516268\">EF</div>\n            <div>\n              <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#17242A\">Dr. Emiliano Ferrero</div>\n              <div style=\"font-family:Lato,sans-serif;font-size:12.5px;color:#6FA030;font-weight:700;margin-top:2px\">Banco Mundial — LAC Education</div>\n            </div>\n          </div>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.65;color:#516268\">Especialista principal en educación para América Latina en el Banco Mundial. Ha liderado operaciones de reforma de financiamiento en Colombia, Perú y México con enfoque en equidad territorial.</p>\n        </div>\n        <div style=\"border:1px solid #DCE3E1;background:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;align-items:center;gap:14px\">\n            <div class=\"expert-avatar\" style=\"background:#0D4A57\">FJ</div>\n            <div>\n              <div style=\"font-family:Lato,sans-serif;font-weight:700;font-size:15px;color:#17242A\">Dra. Francesca Jensana</div>\n              <div style=\"font-family:Lato,sans-serif;font-size:12.5px;color:#6FA030;font-weight:700;margin-top:2px\">UNESCO OREALC</div>\n            </div>\n          </div>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.65;color:#516268\">Coordinadora regional de políticas educativas en la Oficina Regional de Educación para América Latina y el Caribe. Especialista en seguimiento de ODS 4 e indicadores de equidad en sistemas de financiamiento.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n</div><!-- /container -->
